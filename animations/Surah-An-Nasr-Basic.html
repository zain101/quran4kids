*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}
.ar{font-family:'AmiriSub',serif;direction:rtl;font-size:38px;font-size:clamp(28px,6.6vw,42px);
 line-height:2.05;color:#08484C;margin:2px 0 10px}
.tr{color:#B4573F;font-weight:700;font-size:16px;font-size:clamp(13px,3vw,16px);margin-bottom:6px}
.en{color:#4A3E31;font-size:17px;font-size:clamp(14px,3.2vw,17px);line-height:1.5}
.note{margin:12px auto 0;max-width:520px;background:#F5EAD6;border-radius:12px;
 padding:9px 14px;font-size:13.5px;color:#6B5A46}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;
 padding:14px 18px 18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;
 border:2px solid #0E6B70;background:#fff;color:#0E6B70;padding:11px 20px;font-size:15px}
button:hover{background:#0E6B70;color:#fff}
button:disabled{opacity:.32;cursor:default}
button:disabled:hover{background:#fff;color:#0E6B70}
#replay{border-color:#E0A33C;color:#9A6C1E}
#replay:hover{background:#E0A33C;color:#fff}
#know{border-color:#E0A33C;color:#9A6C1E}
#know.on{background:#E0A33C;color:#fff}
#know.on:hover{background:#E0A33C;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #E0A33C;background:#fff;
 cursor:pointer;padding:0}
.dot.on{background:#0E6B70;border-color:#0E6B70}
.dot.done{background:#E0A33C}
.hint{text-align:center;font-size:12px;color:#8C7F70;margin:12px 0 0}

@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
 20%{transform:translate(-5px,1px) rotate(-1.1deg)}40%{transform:translate(5px,-1px) rotate(1.1deg)}
 60%{transform:translate(-4px,2px) rotate(-.8deg)}80%{transform:translate(4px,-2px) rotate(.8deg)}}
.shake{animation:shake .42s infinite;transform-origin:200px 140px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.hop{animation:hop .42s infinite}.h2{animation-delay:.1s}.h3{animation-delay:.2s}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
.pulse{animation:pulse 1.1s infinite}
@keyframes rise{0%{transform:translateY(46px);opacity:0}
 25%{opacity:1}70%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.rise{animation:rise 2.6s infinite ease-out}
.r2{animation-delay:.35s}.r3{animation-delay:.7s}.r4{animation-delay:1.05s}.r5{animation-delay:1.4s}
@keyframes lean{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(6deg)}}
.lean{animation:lean 1.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes qm{0%{transform:translateY(14px) scale(.4);opacity:0}
 35%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.qm{animation:qm 2s infinite}.q2{animation-delay:.3s}.q3{animation-delay:.6s}
@keyframes grow{0%{transform:scale(.3);opacity:0}22%{transform:scale(1);opacity:1}100%{opacity:1}}
.grow{animation:grow 2.8s infinite;transform-box:fill-box;transform-origin:0% 60%}
@keyframes say{0%,22%{stroke-dasharray:0 400}45%,100%{stroke-dasharray:400 0}}
.say{animation:say 2.8s infinite}.s2{animation-delay:.28s}.s3{animation-delay:.56s}
@keyframes rays{0%,100%{opacity:.4}50%{opacity:1}}
.rays{animation:rays 2.2s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.tw circle{animation:tw 1.8s infinite;transform-box:fill-box;transform-origin:50% 50%}
.t2{animation-delay:.45s}.t3{animation-delay:.9s}
@keyframes walk{0%{transform:translateX(-40px)}100%{transform:translateX(300px)}}
.walk{animation:walk 5s linear infinite}.w2{animation-delay:1.5s}.w3{animation-delay:3s}
@keyframes glowarch{0%,100%{opacity:.55}50%{opacity:1}}
.glowarch{animation:glowarch 1.8s infinite}
@keyframes halo{0%,30%{r:0;opacity:0}70%{r:78;opacity:.3}100%{r:88;opacity:0}}
.halo{animation:halo 3.2s infinite}
@keyframes speck{0%{r:5;opacity:1}40%{r:5;opacity:1}55%{r:2;opacity:0}100%{opacity:0}}
.speck{animation:speck 3.2s infinite}
@keyframes bigstar{0%,45%{transform:scale(0);opacity:0}
 62%{transform:scale(1.16);opacity:1}72%{transform:scale(1)}100%{transform:scale(1);opacity:1}}
.bigstar{animation:bigstar 3.2s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes fadein{0%,55%{opacity:0}75%,100%{opacity:1}}
.fadein{animation:fadein 3.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.tilt{animation:tilt 2.4s infinite ease-in-out;transform-origin:290px 84px}

ize=\"14.5\" text-anchor=\"middle\" fill=\"#7A5C3A\" font-weight=\"700\">Mission complete!</text></g><g transform=\"translate(330,150)\"><rect x=\"-20\" y=\"-16\" width=\"40\" height=\"30\" rx=\"3\" fill=\"#F6E7C1\" stroke=\"#B88A1E\" stroke-width=\"3\"/><path d=\"M 0 -16 V 14\" stroke=\"#B88A1E\" stroke-width=\"3\"/></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">Ibn Abbas understood the surah</text>", "en": "<p>The Prophet saw great potential in the young Ibn Abbas, so he prayed to Allah to bless him with knowledge and wisdom. When the Prophet passed away, Ibn Abbas was still a young man. Omar ibn Al-Khattab honoured Ibn Abbas and always asked him for advice.</p>\n<p>One time, Omar asked some senior companions about this <em>surah</em>, and they said that it came to teach the Prophet to praise Allah when victory is achieved. Omar asked Ibn Abbas, who then said that this <em>surah</em> came to tell the Prophet that his mission was now complete and he should get ready to leave this world. Omar said that this was the correct answer. <em>(Recorded by Imam Al-Bukhari)</em></p>"}, {"kind": "story", "ay": 0, "label": "Side story", "title": "Side story &mdash; Ziyad and the sultan", "tr": "", "note": "", "svg": "<rect x=\"0\" y=\"0\" width=\"400\" height=\"180\" fill=\"#F3EBFA\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"42\" fill=\"#8A6A44\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"9\" fill=\"#5E9E5A\"/><g transform=\"translate(100,156) scale(1.7)\"><g class=\"hop\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#6B3FA0\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#6B3FA0\"/><path d=\"M -7 -27 L -7 -35 L -3 -30 L 0 -37 L 3 -30 L 7 -35 L 7 -27 Z\" fill=\"#F2C94C\" stroke=\"#B88A1E\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/></g></g><g transform=\"translate(240,164) scale(1.0)\"><g class=\"lean\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><g class=\"grow\"><rect x=\"150\" y=\"20\" width=\"220\" height=\"34\" rx=\"12\" fill=\"#fff\" stroke=\"#0E6B70\" stroke-width=\"3\"/><path d=\"M 246.0 53 l 8 14 l 10 -14 Z\" fill=\"#fff\" stroke=\"#0E6B70\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"248.0\" y=\"51\" width=\"12\" height=\"5\" fill=\"#fff\"/><text x=\"260.0\" y=\"41.333333333333336\" font-size=\"13\" text-anchor=\"middle\" fill=\"#0E6B70\" font-weight=\"700\">Your finger is more precious!</text></g><g transform=\"translate(330,128) scale(1.3)\"><g class=\"spin\"><circle r=\"16\" fill=\"#F2C94C\" stroke=\"#B88A1E\" stroke-width=\"3\"/><circle r=\"11\" fill=\"none\" stroke=\"#B88A1E\" stroke-width=\"1.5\"/><text y=\"6\" font-size=\"16\" text-anchor=\"middle\" fill=\"#8A6A1E\" font-weight=\"700\">D</text></g></g><g transform=\"translate(30,176) scale(1.1)\"><path d=\"M -14 0 Q -22 -22 -8 -30 L -10 -38 L 10 -38 L 8 -30 Q 22 -22 14 0 Z\" fill=\"#B58A3A\" stroke=\"#6F5018\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M -8 -32 L 8 -32\" stroke=\"#6F5018\" stroke-width=\"3\"/><text x=\"0\" y=\"-8\" font-size=\"18\" text-anchor=\"middle\" fill=\"#FFF1C9\" font-weight=\"700\">$</text></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">Ziyad and the sultan</text>", "en": "<p>According to an old story, a sultan and his assistant visited a poor neighbourhood, where no one recognized them because they were undercover. They came across a boy named Ziyad who was coming back from work. The sultan asked why he had to work, and Ziyad said that he was supporting his mother.</p>\n<p>The sultan wanted to reward Ziyad, so he revealed his true identity and asked, &ldquo;Have you seen anything better than my diamond ring?&rdquo; Ziyad replied, &ldquo;Yes, your finger is more precious.&rdquo; The amazed sultan then asked, &ldquo;Which is better: your house or my palace?&rdquo; Ziyad answered, &ldquo;When you are in your palace, it&rsquo;s better than our house. But if you visit our house, it will be better because you will be in it.&rdquo;</p>\n<p>The sultan was more amazed. He offered Ziyad one gold <em>dinar</em> as an award, but Ziyad refused to take it. When the sultan asked why, Ziyad said, &ldquo;Because my mother will never believe me when I tell her that I got this <em>dinar</em> from the sultan. She will say, &lsquo;No way, the sultan is not cheap to give you only one <em>dinar</em>!&rsquo;&rdquo; The sultan smiled and gave him a bag of 100 <em>dinars</em>, and told his assistant, &ldquo;Let&rsquo;s get out of here. If I talk to this kid for another 5 minutes, he will take away my whole kingdom.&rdquo;</p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>The Prophet is told in this <em>surah</em> that when he achieves victory over Makkah and many people accept Islam, then his mission is complete and he should get ready to meet his Creator.</li>\n<li>The Prophet passed away only a few months after the revelation of this <em>surah</em>. <em>(Recorded by Imam Al-Qurtubi)</em></li>\n<li>Although he was perfect, he always prayed for Allah&rsquo;s forgiveness. We make mistakes all the time, so we should ask Allah to forgive us.</li>\n</ul>"}, {"kind": "story", "ay": 0, "label": "Words of wisdom", "title": "Words of wisdom", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#E3F2FB\"/><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"70\" fill=\"#fff\" opacity=\".6\"/></g><g class=\"beat\"><polygon points=\"150,66 250,66 282,102 200,176 118,102\" fill=\"#B05BC8\" stroke=\"#6E2F86\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 118 102 H 282 M 150 66 L 176 102 L 200 66 L 224 102 L 250 66 M 176 102 L 200 176 L 224 102\" stroke=\"#E9C8F4\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\"/></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"80\" cy=\"50\" r=\"6\"/><circle class=\"t2\" cx=\"330\" cy=\"56\" r=\"6\"/><circle class=\"t3\" cx=\"350\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"60\" cy=\"130\" r=\"4.5\"/><circle class=\"t2\" cx=\"200\" cy=\"30\" r=\"5\"/></g>", "en": "<p>Young people are talented. If they receive proper education and attention, they can achieve their full potential in life. We can learn many good things from kids:</p>\n<ul><li>They are born innocent, so they don&rsquo;t know how to lie or to be racist. Later, some of them pick up these bad qualities by copying the adults around them.</li>\n<li>They are logical and they learn by observing. This is why it&rsquo;s easy for them to learn languages.</li>\n<li>If kids want something (let&rsquo;s say candy, toys, or time on their electronics), they will ask their parents a hundred times. When adults pray, many of them ask Allah only once then they give up. Allah loves it when we keep asking Him for something.</li>\n<li>Imam As-Suyuti said that kids don&rsquo;t worry because they know they are in the care of their guardian, they never blame Allah for bad things, they like to get together (especially when they eat), and even if they fight, they make peace quickly.</li></ul>"}, {"kind": "quiz", "ay": 0, "quiz": true, "label": "Quiz", "title": "Quiz time!", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\"><path d=\"M 200 0 L 120 200 L 280 200 Z\" fill=\"url(#ray)\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"64\" fill=\"#F2C94C\" opacity=\".35\"/></g><g class=\"beat\"><path d=\"M 150 50 h 100 v 34 a 50 50 0 0 1 -100 0 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 150 60 h -22 q -4 34 28 40 M 250 60 h 22 q 4 34 -28 40\" stroke=\"#9A6C1E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"130\" width=\"20\" height=\"26\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"3\"/><rect x=\"164\" y=\"156\" width=\"72\" height=\"14\" rx=\"4\" fill=\"#8A6A44\" stroke=\"#5E4730\" stroke-width=\"3\"/><path tra َّاسَ</div><div class=\"dt\">an-nasa</div><div class=\"dm\">the people</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 2</span><div class=\"da\">يَدْخُلُونَ</div><div class=\"dt\">yadkhuluna</div><div class=\"dm\">entering</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 2</span><div class=\"da\">دِينِ</div><div class=\"dt\">din</div><div class=\"dm\">faith, religion</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 2</span><div class=\"da\">أَفْوَاجًا</div><div class=\"dt\">afwajan</div><div class=\"dm\">in large groups, in crowds</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 3</span><div class=\"da\">فَسَبِّحْ</div><div class=\"dt\">fa-sabbih</div><div class=\"dm\">so glorify</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 3</span><div class=\"da\">بِحَمْدِ</div><div class=\"dt\">bihamdi</div><div class=\"dm\">with the praise of</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 3</span><div class=\"da\">رَبِّكَ</div><div class=\"dt\">rabbika</div><div class=\"dm\">your Lord</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 3</span><div class=\"da\">وَاسْتَغْفِرْهُ</div><div class=\"dt\">wastaghfirhu</div><div class=\"dm\">and ask His forgiveness</div></div><div class=\"dcard\" onclick=\"this.classList.toggle('show')\"><span class=\"dn\">Ayah 3</span><div class=\"da\">تَوَّابًا</div><div class=\"dt\">tawwaban</div><div class=\"dm\">always accepting repentance</div></div></div>"}];
var i = 0;
var known = [];
for (var k = 0; k < A.length; k++) { known.push(false); }
function $(id){ return document.getElementById(id); }

var dots = $('dots');
for (var n = 0; n < A.length; n++) {
  (function(n){
    var b = document.createElement('button');
    b.className = 'dot';
    b.title = A[n].label.replace(' of 3','');
    b.onclick = function(){ i = n; render(); };
    dots.appendChild(b);
  })(n);
}

function render(){
  stopAudio();
  var a = A[i];
  var isAy = a.ay > 0;
  $('stage').innerHTML = '<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">' + a.svg + '</svg>';
  $('ar').className = isAy ? 'ar' : 'ar head';
  $('ar').innerHTML = isAy ? a.ar : a.title;
  $('tr').innerHTML = a.tr;
  $('tr').style.display = isAy ? '' : 'none';
  $('en').className = isAy ? 'en' : 'en story';
  $('en').innerHTML = a.en;
  $('note').innerHTML = a.note;
  $('note').style.display = a.note ? '' : 'none';
  $('count').innerHTML = a.label;
  $('listen').style.display = isAy ? '' : 'none';
  $('know').style.display = isAy ? '' : 'none';
  if (a.quiz) { initQuiz(); }
  $('prev').disabled = (i === 0);
  $('next').disabled = (i === A.length - 1);
  if (A[i].ay > 0) $('know').innerHTML = known[i] ? '★' : '☆';
  $('know').className = known[i] ? 'on' : '';
  var ds = dots.childNodes;
  for (var n = 0; n < ds.length; n++) {
    var cls = 'dot';
    if (n === i) { cls += ' on'; }
    else if (known[n]) { cls += ' done'; }
    ds[n].className = cls;
  }
}
$('prev').onclick = function(){ if (i > 0) { i--; render(); } };
$('next').onclick = function(){ if (i < A.length - 1) { i++; render(); } };
$('replay').onclick = function(){ render(); };
$('know').onclick = function(){ known[i] = !known[i]; render(); };
document.onkeydown = function(e){
  e = e || window.event;
  if (e.keyCode === 39) { $('next').onclick(); }
  if (e.keyCode === 37) { $('prev').onclick(); }
};

var qi = 0, qscore = 0, qdone = false, qcur = [];
function shuf(a){ for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
function initQuiz(){ qi = 0; qscore = 0; showQ(); }
function showQ(){
  var q = QZ[qi]; qdone = false;
  qcur = [];
  for (var k = 0; k < q.o.length; k++) { qcur.push({t: q.o[k], c: k === q.a}); }
  if (!q.keep) { shuf(qcur); }
  var h = '<div class="qhead"><span>Question ' + (qi + 1) + ' of ' + QZ.length + '</span><span>Score: ' + qscore + '</span></div>';
  h += '<div class="qq">' + q.q + '</div>';
  for (var m = 0; m < qcur.length; m++) {
    h += '<button class="qopt' + (q.ar ? ' qar' : '') + '" onclick="qPick(' + m + ')">' + qcur[m].t + '</button>';
  }
  h += '<div class="qfb" id="qfb" style="display:none"></div><button class="qnext ibtn" id="qnext" title="Next question" aria-label="Next question" style="display:none" onclick="qNext()">&rarr;</button>';
  $('quiz').innerHTML = h;
}
function qPick(m){
  if (qdone) { return; }
  qdone = true;
  var q = QZ[qi], btns = $('quiz').getElementsByClassName('qopt');
  for (var k = 0; k < btns.length; k++) {
    if (qcur[k].c) { btns[k].className += ' ok'; }
    else if (k === m) { btns[k].className += ' bad'; }
    else { btns[k].className += ' dim'; }
  }
  var good = qcur[m].c;
  if (good) { qscore++; }
  var fb = $('qfb');
  fb.style.display = '';
  fb.innerHTML = (good ? '\u2705 <b>Correct!</b> ' : '\u274C <b>Not quite.</b> ') + q.why;
  var nx = $('qnext');
  nx.style.display = '';
  nx.title = qi === QZ.length - 1 ? 'See my score' : 'Next question'; nx.innerHTML = qi === QZ.length - 1 ? '\uD83C\uDFC1' : '\u2192';
}
function qNext(){
  if (qi < QZ.length - 1) { qi++; showQ(); return; }
  var n = QZ.length, st = '';
  for (var k = 0; k < n; k++) { st += k < qscore ? '\u2605' : '\u2606'; }
  var msg = qscore === n ? 'Perfect! MashaAllah, you know Surah An-Nasr very well!' : qscore >= n - 2 ? 'Great job! Just a little more practice.' : qscore >= n / 2 ? 'Good try! Look at the slides again and try once more.' : 'Keep going! Read the story and the ayahs again, then try the quiz.';
  $('quiz').innerHTML = '<div class="qres"><div class="big">' + qscore + ' / ' + n + '</div><div class="stars">' + st + '</div><p>' + msg + '</p><button class="ibtn" title="Try again" aria-label="Try again" onclick="initQuiz()">\u21BB</button></div>';
}

/* ---- Audio: Sheikh Dr. Ayman Swaid (Sowaid) ---- */
var SURAH = 110;
var REC = 'Ayman_Sowaid_64kbps';
var au = new Audio();
au.preload = 'auto';
var stage = 0;
function pad3(n){ return ('00' + n).slice(-3); }
function audioName(){ return pad3(SURAH) + pad3(A[i].ay) + '.mp3'; }
function status(t){ $('astat').innerHTML = t; }
function setListen(on){ $('listen').title = on ? 'Stop' : 'Listen'; $('listen').innerHTML = on ? '\u23F8' : '\uD83D\uDD0A'; $('listen').className = on ? 'on' : ''; }
function stopAudio(){ try { au.pause(); } catch(e){} au.onerror = null; au.removeAttribute('src'); setListen(false); status(''); }
function tryPlay(){
  var url = stage === 0 ? 'audio/' + audioName() : 'https://everyayah.com/data/' + REC + '/' + audioName();
  au.src = url;
  var p = au.play();
  if (p && p.catch) { p.catch(function(err){
    if (err && err.name === 'NotAllowedError') { setListen(false); status('Your browser blocked the sound. Tap Listen again.'); }
  }); }
}
au.onended = function(){ setListen(false); status(''); };
au.onplaying = function(){ status(''); };
function onAuError(){
  if (stage === 0) { stage = 1; tryPlay(); }
  else { stage = 2; setListen(false); status('Could not load the recitation. Check your internet connection, or put the mp3 files in a folder named &ldquo;audio&rdquo; next to this page (for example ' + audioName() + ').'); }
}
$('listen').onclick = function(){
  if (!au.paused && au.getAttribute('src')) { stopAudio(); return; }
  stage = 0;
  au.onerror = onAuError;
  setListen(true);
  status('Loading&hellip;');
  tryPlay();
};

render();
</script><script>
/* Surah Lessons: "repeat this ayah 5 times" button next to Listen */
(function(){
  var REPEATS = 5, left = 0, listen = document.getElementById('listen');
  if (!listen || typeof au === 'undefined') { return; }
  var btn = document.createElement('button'), iconOnly = !/[A-Za-z]/.test(listen.textContent);
  btn.id = 'repeat'; btn.title = 'Repeat this ayah 5 times'; btn.setAttribute('aria-label', 'Repeat this ayah 5 times');
  if (iconOnly) { btn.style.fontSize = '15px'; }
  listen.parentNode.insertBefore(btn, listen.nextSibling);
  var st = document.createElement('style'); st.textContent = '#repeat.on{background:#0E6B70;color:#fff}' + (iconOnly ? '@media (max-width:480px){.bar{gap:8px}.bar button{width:44px;height:44px;font-size:19px}#repeat{font-size:13px}#know{font-size:22px}}' : ''); document.head.appendChild(st);
  function label(on){
    var n = REPEATS - left + 1;
    btn.innerHTML = on ? (iconOnly ? n + '/' + REPEATS : '\u23F8 ' + n + ' of ' + REPEATS) : (iconOnly ? '\uD83D\uDD01' + REPEATS : '\uD83D\uDD01 Repeat \u00D7' + REPEATS);
    btn.className = on ? 'on' : '';
  }
  label(false);
  var stop0 = stopAudio;
  stopAudio = function(){ left = 0; label(false); return stop0.apply(this, arguments); };
  var ended0 = au.onended;
  au.onended = function(){
    if (left > 1) { left--; label(true); au.currentTime = 0; var p = au.play(); if (p && p.catch) { p.catch(function(){ stopAudio(); }); } return; }
    left = 0; label(false); if (ended0) { ended0.apply(this, arguments); }
  };
  btn.onclick = function(){
    if (left > 0) { stopAudio(); return; }
    stopAudio(); left = REPEATS; stage = 0; au.onerror = onAuError; setListen(true); status('Loading&hellip;'); label(true); tryPlay();
  };
})();
</script>
<script>
/* Surah Lessons website: reports which ayahs were watched or marked "I know it" (does nothing when this page is opened on its own) */
(function(){
  var SL_ID = 110, map = [], N = 0, seen = {};
  for (var x = 0; x < A.length; x++) { var ay = (A[x].ay === undefined) ? x + 1 : A[x].ay; map.push(ay); if (ay > 0) { N++; } }
  function post(m){ try { if (window.parent && window.parent !== window) { window.parent.postMessage(m, '*'); } } catch (e) {} }
  function report(){
    var k = [], v = [];
    for (var x = 0; x < A.length; x++) { if (map[x] > 0) { if (known[x]) { k.push(map[x]); } if (seen[x]) { v.push(map[x]); } } }
    post({type: 'sl-anim', surahId: SL_ID, total: N, viewed: v, known: k});
  }
  var r0 = render;
  render = function(){ var res = r0.apply(this, arguments); seen[i] = 1; report(); return res; };
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'sl-state' || d.surahId !== SL_ID) { return; }
    for (var x = 0; x < A.length; x++) {
      var ay = map[x];
      if (ay > 0) { if (d.known && d.known.indexOf(ay) >= 0) { known[x] = true; } if (d.viewed && d.viewed.indexOf(ay) >= 0) { seen[x] = 1; } }
    }
    r0(); seen[i] = 1; report();
  });
  seen[i] = 1; post({type: 'sl-ready', surahId: SL_ID}); report();
})();
</script>
