*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}
.ar{font-family:'AmiriSub',serif;direction:rtl;font-size:38px;font-size:clamp(28px,6.6vw,42px);
 line-height:2.05;color:#08484C;margin:2px 0 10px}
.tr{color:#B4573F;font-weight:700;font-size:16px;font-size:clamp(13px,3vw,16px);margin-bottom:6px}
.en{color:#4A3E31;font-size:17px;font-size:clamp(14px,3.2vw,17px);line-height:1.5}
.note{margin:12px auto 0;max-width:520px;background:#F5EAD6;border-radius:12px;
 padding:9px 14px;font-size:13.5px;color:#6B5A46}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;
 padding:14px 18px 18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;
 border:2px solid #0E6B70;background:#fff;color:#0E6B70;padding:11px 20px;font-size:15px}
button:hover{background:#0E6B70;color:#fff}
button:disabled{opacity:.32;cursor:default}
button:disabled:hover{background:#fff;color:#0E6B70}
#replay{border-color:#E0A33C;color:#9A6C1E}
#replay:hover{background:#E0A33C;color:#fff}
#know{border-color:#E0A33C;color:#9A6C1E}
#know.on{background:#E0A33C;color:#fff}
#know.on:hover{background:#E0A33C;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #E0A33C;background:#fff;
 cursor:pointer;padding:0}
.dot.on{background:#0E6B70;border-color:#0E6B70}
.dot.done{background:#E0A33C}
.hint{text-align:center;font-size:12px;color:#8C7F70;margin:12px 0 0}

@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
 20%{transform:translate(-5px,1px) rotate(-1.1deg)}40%{transform:translate(5px,-1px) rotate(1.1deg)}
 60%{transform:translate(-4px,2px) rotate(-.8deg)}80%{transform:translate(4px,-2px) rotate(.8deg)}}
.shake{animation:shake .42s infinite;transform-origin:200px 140px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.hop{animation:hop .42s infinite}.h2{animation-delay:.1s}.h3{animation-delay:.2s}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
.pulse{animation:pulse 1.1s infinite}
@keyframes rise{0%{transform:translateY(46px);opacity:0}
 25%{opacity:1}70%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.rise{animation:rise 2.6s infinite ease-out}
.r2{animation-delay:.35s}.r3{animation-delay:.7s}.r4{animation-delay:1.05s}.r5{animation-delay:1.4s}
@keyframes lean{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(6deg)}}
.lean{animation:lean 1.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes qm{0%{transform:translateY(14px) scale(.4);opacity:0}
 35%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.qm{animation:qm 2s infinite}.q2{animation-delay:.3s}.q3{animation-delay:.6s}
@keyframes grow{0%{transform:scale(.3);opacity:0}22%{transform:scale(1);opacity:1}100%{opacity:1}}
.grow{animation:grow 2.8s infinite;transform-box:fill-box;transform-origin:0% 60%}
@keyframes say{0%,22%{stroke-dasharray:0 400}45%,100%{stroke-dasharray:400 0}}
.say{animation:say 2.8s infinite}.s2{animation-delay:.28s}.s3{animation-delay:.56s}
@keyframes rays{0%,100%{opacity:.4}50%{opacity:1}}
.rays{animation:rays 2.2s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.tw circle{animation:tw 1.8s infinite;transform-box:fill-box;transform-origin:50% 50%}
.t2{animation-delay:.45s}.t3{animation-delay:.9s}
@keyframes walk{0%{transform:translateX(-40px)}100%{transform:translateX(300px)}}
.walk{animation:walk 5s linear infinite}.w2{animation-delay:1.5s}.w3{animation-delay:3s}
@keyframes glowarch{0%,100%{opacity:.55}50%{opacity:1}}
.glowarch{animation:glowarch 1.8s infinite}
@keyframes halo{0%,30%{r:0;opacity:0}70%{r:78;opacity:.3}100%{r:88;opacity:0}}
.halo{animation:halo 3.2s infinite}
@keyframes speck{0%{r:5;opacity:1}40%{r:5;opacity:1}55%{r:2;opacity:0}100%{opacity:0}}
.speck{animation:speck 3.2s infinite}
@keyframes bigstar{0%,45%{transform:scale(0);opacity:0}
 62%{transform:scale(1.16);opacity:1}72%{transform:scale(1)}100%{transform:scale(1);opacity:1}}
.bigstar{animation:bigstar 3.2s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes fadein{0%,55%{opacity:0}75%,100%{opacity:1}}
.fadein{animation:fadein 3.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes drop{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.drop{animation:drop 2.6s infinite}.p2{animation-delay:.5s}.p3{animation-delay:1s}.p4{animation-delay:1.5s}.p5{animation-delay:2s}
@keyframes cara{0%{transform:translateX(-150px)}100%{transform:translateX(430px)}}
.cara{animation:cara 9s linear infinite}
@keyframes bow{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(42deg)}}
.bow{animation:bow 3.2s infinite ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.beat{animation:beat 1.4s infinite;transform-box:fill-box;transform-origin:50% 50%}

@keyframes flick{0%,100%{transform:scale(1,.88)}50%{transform:scale(.92,1.12)}}
.flick{animation:flick .6s infinite;transform-box:fill-box;transform-origin:50% 100%}.f2{animation-delay:.2s}.f3{animation-delay:.4s}
@keyframes spinr{to{transform:rotate(360deg)}}
.ar.head{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;direction:ltr;font-size:22px;line-height:1.3;font-weight:700;color:#B4573F;margin:2px 0 8px}
.en.story{text-align:left;font-size:15.5px;line-height:1.6;max-width:660px;margin:0 auto}
.en.story p{margin:0 0 9px}
.en.story ul{margin:0;padding-left:22px}
.en.story li{margin:0 0 7px}
.en.story li::marker{color:#E0A33C}
#listen{border-color:#0E6B70;color:#0E6B70}#listen.on{background:#0E6B70;color:#fff}

.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#9A6C1E;margin-bottom:8px}
.qq{font-size:17px;font-weight:700;color:#08484C;margin:2px 0 10px;line-height:1.45}
.qopt{display:block;width:100%;text-align:left;border-radius:14px;padding:10px 14px;font-size:15px;margin:7px 0;font-weight:600}
.qopt.qar{font-family:'AmiriSub',serif;direction:rtl;text-align:right;font-size:24px;line-height:1.8;padding:4px 16px}
.qopt.ok,.qopt.ok:hover{background:#DDF2E0;border-color:#3E9B55;color:#1F5E31}
.qopt.bad,.qopt.bad:hover{background:#FBE0DA;border-color:#B4573F;color:#8C2F1E}
.qopt.dim,.qopt.dim:hover{background:#fff;color:#0E6B70;opacity:.45;cursor:default}
.qfb{margin:10px 0 4px;padding:9px 14px;border-radius:12px;background:#F5EAD6;color:#6B5A46;font-size:14px;line-height:1.5}
.qnext{margin-top:8px}
.qres{text-align:center;padding:6px 0 4px}
.qres .big{font-size:34px;font-weight:800;color:#0E6B70}
.qres .stars{font-size:34px;color:#E0A33C;letter-spacing:4px;margin:4px 0}
.qres p{margin:6px 0 12px}

.dtools{text-align:center;margin:0 0 10px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}
.dcard{position:relative;border:2px solid #F6DFAE;background:#FFFDF7;border-radius:14px;padding:8px 12px 10px;text-align:center;cursor:pointer}
.dcard:hover{border-color:#E0A33C}
.dcard .da{font-family:'AmiriSub',serif;direction:rtl;font-size:32px;line-height:1.7;color:#08484C}
.dcard .dt{color:#B4573F;font-weight:700;font-size:14px}
.dcard .dm{color:#4A3E31;font-size:15px;margin-top:2px}
.dcard .dn{position:absolute;top:6px;left:8px;background:#F6DFAE;color:#08484C;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.dgrid.hid .dcard:not(.show) .dt{visibility:hidden}
.dgrid.hid .dcard:not(.show) .dm{font-size:0;line-height:0}
.dgrid.hid .dcard:not(.show) .dm::before{content:'tap to see';display:block;font-size:14px;line-height:1.5;color:#8C7F70;font-style:italic;text-align:center}

.bar button,.ibtn{width:50px;height:50px;padding:0;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.bar{gap:12px}

width=\"3\" stroke-linecap=\"round\"><path class=\"drop\" d=\"M 100 70 v 10\"/><path class=\"drop p3\" d=\"M 126 70 v 10\"/></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">the people of the left</text>"}, {"kind": "ayah", "ay": 20, "label": "Ayah 20 of 20", "ar": "عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ", "tr": "‘Alayhim narun mu’sadah", "en": "The Fire will be shut over them.", "note": "A serious warning for those who refuse to believe.", "svg": "<rect x=\"0\" y=\"178\" width=\"400\" height=\"42\" fill=\"#8A6A44\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"9\" fill=\"#5E9E5A\"/><g transform=\"translate(165,176) scale(1.2)\"><path class=\"flick \" d=\"M 0 0 C -16 -10 -12 -32 0 -52 C 5 -36 20 -28 16 -8 C 14 0 7 4 0 4 Z\" fill=\"#B4573F\"/></g><g transform=\"translate(200,178) scale(1.7)\"><path class=\"flick f2\" d=\"M 0 0 C -16 -10 -12 -32 0 -52 C 5 -36 20 -28 16 -8 C 14 0 7 4 0 4 Z\" fill=\"#F2994A\"/></g><g transform=\"translate(235,176) scale(1.2)\"><path class=\"flick f3\" d=\"M 0 0 C -16 -10 -12 -32 0 -52 C 5 -36 20 -28 16 -8 C 14 0 7 4 0 4 Z\" fill=\"#B4573F\"/></g><g transform=\"translate(200,178) scale(0.9)\"><path class=\"flick \" d=\"M 0 0 C -16 -10 -12 -32 0 -52 C 5 -36 20 -28 16 -8 C 14 0 7 4 0 4 Z\" fill=\"#F2C94C\"/></g><g fill=\"#5E4730\" stroke=\"#3A2A18\" stroke-width=\"2\"><rect x=\"136\" y=\"60\" width=\"12\" height=\"118\"/><rect x=\"168\" y=\"60\" width=\"12\" height=\"118\"/><rect x=\"200\" y=\"60\" width=\"12\" height=\"118\"/><rect x=\"232\" y=\"60\" width=\"12\" height=\"118\"/><rect x=\"264\" y=\"60\" width=\"12\" height=\"118\"/><rect x=\"128\" y=\"108\" width=\"156\" height=\"12\"/></g><rect x=\"186\" y=\"96\" width=\"38\" height=\"32\" rx=\"5\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"3\"/><circle cx=\"205\" cy=\"110\" r=\"4\" fill=\"#5E4730\"/><g class=\"drift\"><g fill=\"#8C8C8C\" opacity=\".9\"><circle cx=\"170\" cy=\"30\" r=\"14\"/><circle cx=\"196\" cy=\"22\" r=\"18\"/><circle cx=\"224\" cy=\"32\" r=\"14\"/><rect x=\"170\" y=\"30\" width=\"54\" height=\"14\" rx=\"6\"/></g></g>"}, {"kind": "story", "ay": 0, "label": "Side story", "title": "Side story &mdash; Omar&rsquo;s dream", "tr": "", "note": "Can you find the countries where all of these food items came from on a world map?", "svg": "<rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#DDEBF5\"/><g fill=\"#fff\" opacity=\".8\"><circle cx=\"60\" cy=\"40\" r=\"18\"/><circle cx=\"84\" cy=\"34\" r=\"22\"/><circle cx=\"110\" cy=\"42\" r=\"16\"/><circle cx=\"310\" cy=\"36\" r=\"16\"/><circle cx=\"334\" cy=\"30\" r=\"20\"/><circle cx=\"358\" cy=\"40\" r=\"14\"/></g><ellipse cx=\"200\" cy=\"150\" rx=\"92\" ry=\"34\" fill=\"#2F86A6\" stroke=\"#1D5C75\" stroke-width=\"4\"/><ellipse cx=\"200\" cy=\"148\" rx=\"70\" ry=\"24\" fill=\"#3FA7AD\"/><path d=\"M 150 148 q 20 -22 40 0 q 20 -20 40 0\" fill=\"#fff\" stroke=\"#CFC8BC\" stroke-width=\"2\"/><rect x=\"186\" y=\"132\" width=\"40\" height=\"18\" rx=\"8\" fill=\"#F2994A\" stroke=\"#C26A1E\" stroke-width=\"2\"/><g font-size=\"28\" text-anchor=\"middle\"><text class=\"fly\" style=\"--dx:-150px;--dy:-80px\" x=\"120\" y=\"110\">&#127834;</text><text class=\"fly f2\" style=\"--dx:160px;--dy:-80px\" x=\"280\" y=\"110\">&#127798;&#65039;</text><text class=\"fly f3\" style=\"--dx:-170px;--dy:-30px\" x=\"100\" y=\"150\">&#129365;</text><text class=\"fly f4\" style=\"--dx:170px;--dy:-30px\" x=\"300\" y=\"150\">&#127812;</text><text class=\"fly f5\" style=\"--dx:0px;--dy:-110px\" x=\"200\" y=\"100\">&#129474;</text></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#08484C\" font-weight=\"700\" class=\"fadein\">Omar&rsquo;s dream: the plate of food</text>", "en": "<p><em>As-salamu &lsquo;alaikum!</em> My name is Omar, I&rsquo;m from Canada. I had a dream last night, where this delicious plate of food took me to court. The rice complained to the judge that it came all the way from Indonesia, the green peppers came from Mexico, the olive oil from Palestine, the salmon from Australia, the carrots from the US, the onions from South Africa, the pink salt from Pakistan, and the mushrooms from Canada.</p>\n<p>They all complained that they had to travel thousands of miles to my table, with many people involved in the farming, picking, fishing, driving, selling, cooking, and serving of this meal. But half of this dish went to garbage.</p>\n<p>To be honest, I was not aware of this food&rsquo;s long journey, or how much effort it took to come to my plate. I apologized to all the items in the dish and promised the judge to always finish my food or to share it with someone who doesn&rsquo;t have enough food for the day. <em>Al-hamdu-lillah.</em></p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>Allah puts us through challenges to show us who will pass the test and who will fail.</li>\n<li>Some people are tested with good health and wealth to see if they will be thankful.</li>\n<li>Everyone is gifted with the ability to tell right from wrong.</li>\n<li>Those who use this gift to do what is right are promised a great reward, and those who choose to do evil are warned of a horrible punishment.</li>\n</ul>"}, {"kind": "story", "ay": 0, "label": "Words of wisdom", "title": "Words of wisdom", "tr": "", "note": "According to the next passage, instead of wasting, we should try to feed the hungry and take care of orphans.", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#E3F2FB\"/><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"70\" fill=\"#fff\" opacity=\".6\"/></g><g class=\"beat\"><polygon points=\"150,66 250,66 282,102 200,176 118,102\" fill=\"#B05BC8\" stroke=\"#6E2F86\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 118 102 H 282 M 150 66 L 176 102 L 200 66 L 224 102 L 250 66 M 176 102 L 200 176 L 224 102\" stroke=\"#E9C8F4\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\"/></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"80\" cy=\"50\" r=\"6\"/><circle class=\"t2\" cx=\"330\" cy=\"56\" r=\"6\"/><circle class=\"t3\" cx=\"350\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"60\" cy=\"130\" r=\"4.5\"/><circle class=\"t2\" cx=\"200\" cy=\"30\" r=\"5\"/></g>", "en": "<p>Wasting is a bad habit. A Muslim shouldn&rsquo;t waste. However, some of us waste without paying attention. This includes:</p>\n<ul>\n<li>Wasting money on things that we don&rsquo;t really need.</li>\n<li>Wasting gallons of water just to brush our teeth.</li>\n<li>Leaving the lights on for no reason.</li>\n<li>Taking one bite of an apple then leaving it to rot.</li>\n<li>Filling up our plates with food we can never finish.</li>\n<li>Using an entire toilet paper roll at once to wipe ourselves after using the washroom.</li>\n<li>Drinking a few sips of a juice box and throwing out the rest.</li>\n<li>Using a few pages of a sketch book and then asking for a new one.</li>\n<li>Asking for our clothes to be washed even when they are not dirty.</li>\n<li>And the worst of all: wasting our time.</li>\n</ul>"}, {"kind": "quiz", "ay": 0, "quiz": true, "label": "Quiz", "title": "Quiz time!", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\"><path d=\"M 200 0 L 120 200 L 280 200 Z\" fill=\"url(#ray)\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"64\" fill=\"#F2C94C\" opacity=\".35\"/></g><g class=\"beat\"><path d=\"M 150 50 h 100 v 34 a 50 50 0 0 1 -100 0 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 150 60 h -22 q -4 34 28 40 M 250 60 h 22 q 4 34 -28 40\" stroke=\"#9A6C1E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"130\" width=\"20\" height=\"26\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"3\"/><rect x=\"164\" y=\"156\" width=\"72\" height=\"14\" rx=\"4\" fill=\"#8A6A44\" stroke=\"#5E4730\" stroke-width=\"3\"/><path transform=\"translate(200,86) scale(.9)\" d=\"M 0 -24 l 7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 Z\" fill=\"#fff\" stroke=\"#9A6C1E\" stroke-width=\"2\"/></g><g fill=\"#E0A
