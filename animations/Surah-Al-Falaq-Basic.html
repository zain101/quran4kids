*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}
.ar{font-family:'AmiriSub',serif;direction:rtl;font-size:38px;font-size:clamp(28px,6.6vw,42px);
 line-height:2.05;color:#08484C;margin:2px 0 10px}
.tr{color:#B4573F;font-weight:700;font-size:16px;font-size:clamp(13px,3vw,16px);margin-bottom:6px}
.en{color:#4A3E31;font-size:17px;font-size:clamp(14px,3.2vw,17px);line-height:1.5}
.note{margin:12px auto 0;max-width:520px;background:#F5EAD6;border-radius:12px;
 padding:9px 14px;font-size:13.5px;color:#6B5A46}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;
 padding:14px 18px 18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;
 border:2px solid #0E6B70;background:#fff;color:#0E6B70;padding:11px 20px;font-size:15px}
button:hover{background:#0E6B70;color:#fff}
button:disabled{opacity:.32;cursor:default}
button:disabled:hover{background:#fff;color:#0E6B70}
#replay{border-color:#E0A33C;color:#9A6C1E}
#replay:hover{background:#E0A33C;color:#fff}
#know{border-color:#E0A33C;color:#9A6C1E}
#know.on{background:#E0A33C;color:#fff}
#know.on:hover{background:#E0A33C;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #E0A33C;background:#fff;
 cursor:pointer;padding:0}
.dot.on{background:#0E6B70;border-color:#0E6B70}
.dot.done{background:#E0A33C}

g><g class=\"flick\"><circle cx=\"82\" cy=\"118\" r=\"3\" fill=\"#2F6B3A\"/><circle cx=\"92\" cy=\"118\" r=\"3\" fill=\"#2F6B3A\"/></g><g stroke=\"#4F9A57\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" class=\"drift d2\"><path d=\"M 110 124 q 20 -10 40 0 t 40 0\"/></g><g transform=\"translate(300,160) scale(1.5)\"><g class=\"hop\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><g transform=\"translate(300,112)\"><path d=\"M -14 -4 h 28 v 6 q 0 14 -14 14 q -14 0 -14 -14 Z\" fill=\"#F2C94C\" stroke=\"#B88A1E\" stroke-width=\"2.5\"/><path d=\"M -14 -2 q -10 0 -8 8 q 3 5 8 4 M 14 -2 q 10 0 8 8 q -3 5 -8 4\" fill=\"none\" stroke=\"#B88A1E\" stroke-width=\"2.5\"/><rect x=\"-8\" y=\"14\" width=\"16\" height=\"5\" fill=\"#B88A1E\"/></g><g transform=\"translate(200,100) scale(0.7)\"><g class=\"glowarch\"><path d=\"M 0 -34 L 30 -24 V 6 Q 30 30 0 44 Q -30 30 -30 6 V -24 Z\" fill=\"#7FC4D8\" stroke=\"#0E6B70\" stroke-width=\"3\"/><path d=\"M -12 4 l 9 10 18 -22\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">the jealous when they envy</text>"}, {"kind": "story", "ay": 0, "label": "Side story", "title": "Side story &mdash; Three jealous workers and a genie", "tr": "", "note": "", "svg": "<rect x=\"0\" y=\"0\" width=\"400\" height=\"180\" fill=\"#FFF1C9\"/><rect x=\"0\" y=\"172\" width=\"400\" height=\"48\" fill=\"#D9B06A\"/><rect x=\"0\" y=\"172\" width=\"400\" height=\"8\" fill=\"#C99A5B\"/><g transform=\"translate(200,170) scale(1.4)\"><path d=\"M -22 0 Q -22 -14 0 -14 Q 22 -14 22 0 Q 12 6 -12 6 Z\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"2.5\"/><path d=\"M 20 -6 Q 34 -10 32 -20 L 28 -18 Q 28 -10 20 -8 Z\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"2\"/><path d=\"M -22 -4 Q -34 -8 -32 4\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><rect x=\"-8\" y=\"6\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#9A6C1E\"/></g><text x=\"200\" y=\"122\" font-size=\"66\" text-anchor=\"middle\" class=\"hop\">&#129502;</text><g transform=\"translate(80,158) scale(1.2)\"><g class=\"lean\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#B4573F\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#B4573F\"/></g></g><g transform=\"translate(120,160) scale(1.2)\"><g class=\"lean d2\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><g transform=\"translate(300,158) scale(1.2)\"><g class=\"lean\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#7A5C3A\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#7A5C3A\"/></g></g><g transform=\"translate(340,160) scale(1.2)\"><g class=\"lean d2\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#8C2F1E\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#8C2F1E\"/></g></g><g transform=\"translate(60,66) scale(0.8)\"><g class=\"drift\"><ellipse cx=\"0\" cy=\"0\" rx=\"26\" ry=\"11\" fill=\"#fff\"/><circle cx=\"-10\" cy=\"-8\" r=\"11\" fill=\"#fff\"/><circle cx=\"8\" cy=\"-11\" r=\"13\" fill=\"#fff\"/></g></g><g transform=\"translate(340,70) scale(0.8)\"><g class=\"drift d2\"><ellipse cx=\"0\" cy=\"0\" rx=\"26\" ry=\"11\" fill=\"#fff\"/><circle cx=\"-10\" cy=\"-8\" r=\"11\" fill=\"#fff\"/><circle cx=\"8\" cy=\"-11\" r=\"13\" fill=\"#fff\"/></g></g><text x=\"110\" y=\"76\" font-size=\"22\" font-weight=\"700\" fill=\"#8C2F1E\" class=\"rise r1\">poof!</text><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#5B3F17\" font-weight=\"700\" class=\"fadein\">Three jealous workers and a genie</text>", "en": "<p>This is a fictional story of 3 people who used to work for a store. They always got each other in trouble because they were jealous of one another. One day, the store owner asked them to travel a long distance to buy things for the store. On the way, they got lost in the desert, and used up all the food and water they had with them.</p>\n<p>As they starved, they decided to dig a hole in search of water. However, they found a magic lamp instead. When they rubbed it, the genie came out and told them that each had only one wish. They started to fight over who should start first.</p>\n<p>One of them snatched the lamp and asked the genie to send him back to the store, and <em>poof</em>, he found himself in the store. The next guy pushed the other one away, and asked the genie to take him back to the store, and <em>poof</em>, he found himself in the store with the other guy.</p>\n<p>The third one was very mad because they left him behind with the genie. He demanded, &ldquo;Here is my wish: I want these two guys back right now!&rdquo; And <em>poof</em>. <b>Jealous people end up harming themselves.</b></p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>Like the next <em>surah</em>, this <em>surah</em> is a prayer to Allah for protection from every type of harm including attacks at night, evil spells, and envy.</li>\n<li>Allah, Who is able to remove the darkness of night and bring daylight, is able to protect us all from any harm.</li>\n<li>No one can protect us from bad things or bless us with good things except Allah.</li>\n</ul>"}, {"kind": "story", "ay": 0, "label": "Words of wisdom", "title": "Words of wisdom", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#E3F2FB\"/><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"70\" fill=\"#fff\" opacity=\".6\"/></g><g class=\"beat\"><polygon points=\"150,66 250,66 282,102 200,176 118,102\" fill=\"#B05BC8\" stroke=\"#6E2F86\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 118 102 H 282 M 150 66 L 176 102 L 200 66 L 224 102 L 250 66 M 176 102 L 200 176 L 224 102\" stroke=\"#E9C8F4\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\"/></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"80\" cy=\"50\" r=\"6\"/><circle class=\"t2\" cx=\"330\" cy=\"56\" r=\"6\"/><circle class=\"t3\" cx=\"350\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"60\" cy=\"130\" r=\"4.5\"/><circle class=\"t2\" cx=\"200\" cy=\"30\" r=\"5\"/></g>", "en": "<p>When we see someone blessed with something good, we should say, &ldquo;<em>Ma-sha-Allah</em>,&rdquo; and ask Allah to bless them with more. The angels will say, &ldquo;And you too will get the same.&rdquo; <em>(Recorded by Imam Muslim)</em></p>\n<p>Envy is not a good quality. Some people become jealous when they see a person with many blessings. They even wish that those blessings are taken away from that person. Those who envy others are disrespectful to Allah because they think He doesn&rsquo;t put blessings in the right place. Jealous people harm themselves before they harm others.</p>\n<p>Some people have &lsquo;evil eyes&rsquo;, which basically means that they may look at you with jealousy. We should try to protect ourselves by protecting our privacy, especially online. We don&rsquo;t have to tell people about everything that Allah has blessed us with. Also, we need to recite this <em>surah</em> and the next one as well as morning and evening <em>du&rsquo;as</em> (known as <em>azkar</em>) for protection.</p>"}, {"kind": "quiz", "ay": 0, "quiz": true, "label": "Quiz", "title": "Quiz time!", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\"><path d=\"M 200 0 L 120 200 L 280 200 Z\" fill=\"url(#ray)\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"64\" fill=\"#F2C94C\" opacity=\".35\"/></g><g class=\"beat\"><path d=\"M 150 50 h 100 v 34 a 50 50 0 0 1 -100 0 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 150 60 h -22 q -4 34 28 40 M 250 60 h 22 q 4 34 -28 40\" stroke=\"#9A6C1E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"130\" width=\"20\" height=\"26\" fill=\"#E0A33C\" stroke=\"#9A6C1E\"
