*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}
.ar{font-family:'AmiriSub',serif;direction:rtl;font-size:38px;font-size:clamp(28px,6.6vw,42px);
 line-height:2.05;color:#08484C;margin:2px 0 10px}
.tr{color:#B4573F;font-weight:700;font-size:16px;font-size:clamp(13px,3vw,16px);margin-bottom:6px}
.en{color:#4A3E31;font-size:17px;font-size:clamp(14px,3.2vw,17px);line-height:1.5}
.note{margin:12px auto 0;max-width:520px;background:#F5EAD6;border-radius:12px;
 padding:9px 14px;font-size:13.5px;color:#6B5A46}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;
 padding:14px 18px 18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;
 border:2px solid #0E6B70;background:#fff;color:#0E6B70;padding:11px 20px;font-size:15px}
button:hover{background:#0E6B70;color:#fff}
button:disabled{opacity:.32;cursor:default}
button:disabled:hover{background:#fff;color:#0E6B70}
#replay{border-color:#E0A33C;color:#9A6C1E}
#replay:hover{background:#E0A33C;color:#fff}
#know{border-color:#E0A33C;color:#9A6C1E}
#know.on{background:#E0A33C;color:#fff}
#know.on:hover{background:#E0A33C;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #E0A33C;background:#fff;
 cursor:pointer;padding:0}
.dot.on{background:#0E6B70;border-color:#0E6B70}
.dot.done{background:#E0A33C}
.hint{text-align:center;font-size:12px;color:#8C7F70;margin:12px 0 0}

@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
 20%{transform:translate(-5px,1px) rotate(-1.1deg)}40%{transform:translate(5px,-1px) rotate(1.1deg)}
 60%{transform:translate(-4px,2px) rotate(-.8deg)}80%{transform:translate(4px,-2px) rotate(.8deg)}}
.shake{animation:shake .42s infinite;transform-origin:200px 140px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.hop{animation:hop .42s infinite}.h2{animation-delay:.1s}.h3{animation-delay:.2s}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
.pulse{animation:pulse 1.1s infinite}
@keyframes rise{0%{transform:translateY(46px);opacity:0}
 25%{opacity:1}70%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.rise{animation:rise 2.6s infinite ease-out}
.r2{animation-delay:.35s}.r3{animation-delay:.7s}.r4{animation-delay:1.05s}.r5{animation-delay:1.4s}
@keyframes lean{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(6deg)}}
.lean{animation:lean 1.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes qm{0%{transform:translateY(14px) scale(.4);opacity:0}
 35%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.qm{animation:qm 2s infinite}.q2{animation-delay:.3s}.q3{animation-delay:.6s}
@keyframes grow{0%{transform:scale(.3);opacity:0}22%{transform:scale(1);opacity:1}100%{opacity:1}}
.grow{animation:grow 2.8s infinite;transform-box:fill-box;transform-origin:0% 60%}
@keyframes say{0%,22%{stroke-dasharray:0 400}45%,100%{stroke-dasharray:400 0}}
.say{animation:say 2.8s infinite}.s2{animation-delay:.28s}.s3{animation-delay:.56s}
@keyframes rays{0%,100%{opacity:.4}50%{opacity:1}}
.rays{animation:rays 2.2s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.tw circle{animation:tw 1.8s infinite;transform-box:fill-box;transform-origin:50% 50%}
.t2{animation-delay:.45s}.t3{animation-delay:.9s}
@keyframes walk{0%{transform:translateX(-40px)}100%{transform:translateX(300px)}}
.walk{animation:walk 5s linear infinite}.w2{animation-delay:1.5s}.w3{animation-delay:3s}
@keyframes glowarch{0%,100%{opacity:.55}50%{opacity:1}}
.glowarch{animation:glowarch 1.8s infinite}
@keyframes halo{0%,30%{r:0;opacity:0}70%{r:78;opacity:.3}100%{r:88;opacity:0}}
.halo{animation:halo 3.2s infinite}
@keyframes speck{0%{r:5;opacity:1}40%{r:5;opacity:1}55%{r:2;opacity:0}100%{opacity:0}}
.speck{animation:speck 3.2s infinite}
@keyframes bigstar{0%,45%{transform:scale(0);opacity:0}
 62%{transform:scale(1.16);opacity:1}72%{transform:scale(1)}100%{transform:scale(1);opacity:1}}
.bigstar{animation:bigstar 3.2s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes fadein{0%,55%{opacity:0}75%,100%{opacity:1}}
.fadein{animation:fadein 3.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.tilt{animation:tilt 2.4s infinite ease-in-out;transform-origin:290px 84px}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.wave{animation:wave .55s infinite ease-in-out;transform-origin:134px 160px}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.tear{animation:tear 1.6s infinite}.tr2{animation-delay:.8s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 3s linear infinite;transform-origin:300px 80px}
@keyframes drift{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.drift{animation:drift 3.4s infinite ease-in-out}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(70px);opacity:0}}
.drop{animation:drop 1.3s infinite}.p2{animation-delay:.3s}.p3{animation-delay:.6s}.p4{animation-delay:.9s}
@keyframes sunmove{0%{transform:translate(0,14px)}50%{transform:translate(160px,-22px)}100%{transform:translate(320px,14px)}}
.sunmove{animation:sunmove 6s linear infinite}
@keyframes zz{0%{transform:translate(0,10px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(16px,-24px) scale(1.15);opacity:0}}
.zz{animation:zz 2.4s infinite}.z2{animation-delay:.8s}.z3{animation-delay:1.6s}
@keyframes flash{0%,60%,100%{opacity:0}66%{opacity:.95}82%{opacity:0}}
.flash{animation:flash 1.8s infinite}
@keyframes sujood{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.suj{animation:sujood 2.2s infinite ease-in-out}.j2{animation-delay:.5s}.j3{animation-delay:1s}
@keyframes door{0%,20%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
.door{animation:door 3s infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes xpop{0%,50%{opacity:0;transform:scale(.3)}70%,100%{opacity:1;transform:scale(1)}}
.xpop{animation:xpop 3s infinite;transform-box:fill-box;transform-origin:50% 50%}
.hint a{color:inherit}
#book{border-color:#B4573F;color:#B4573F}
#book:hover,#book.on{background:#B4573F;color:#fff}
.panel{margin:0 18px 18px;background:#F5EAD6;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.55;color:#4A3E31;text-align:left}
.panel[hidden]{display:none}
.panel h3{margin:10px 0 4px;font-size:15px;color:#0E6B70}
.panel h3:first-child{margin-top:0}
.panel ul{margin:4px 0 0;padding-left:20px}
.panel li{margin:3px 0}
#listen{border-color:#0E6B70;color:#0E6B70}#listen.on{background:#0E6B70;color:#fff}
@keyframes drop{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(150px);opacity:0}}
.drop{animation:drop 2.6s infinite}.p2{animation-delay:.5s}.p3{animation-delay:1s}.p4{animation-delay:1.5s}.p5{animation-delay:2s}
@keyframes cara{0%{transform:translateX(-150px)}100%{transform:translateX(430px)}}
.cara{animation:cara 9s linear infinite}
@keyframes bow{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(42deg)}}
.bow{animation:bow 3.2s infinite ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.beat{animation:beat 1.4s infinite;transform-box:fill-box;transform-origin:50% 50%}

@keyframes flick{0%,100%{transform:scale(1,.88)}50%{transform:scale(.92,1.12)}}
.flick{animation:flick .6s infinite;transform-box:fill-box;transform-origin:50% 100%}.f2{animation-delay:.2s}.f3{animation-delay:.4s}
@keyframes spinr{to{transform:rotate(360deg)}}
.ar.head{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;direction:ltr;font-size:22px;line-height:1.3;font-weight:700;color:#B4573F;margin:2px 0 8px}
.en.story{text-align:left;font-size:15.5px;line-height:1.6;max-width:660px;margin:0 auto}
.en.story p{margin:0 0 9px}
.en.story ul{margin:0;padding-left:22px}

.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#9A6C1E;margin-bottom:8px}
.qq{font-size:17px;font-weight:700;color:#08484C;margin:2px 0 10px;line-height:1.45}

.qopt.qar{font-family:'AmiriSub',serif;direction:rtl;text-align:right;font-size:24px;line-height:1.8;padding:4px 16px}
.qopt.ok,.qopt.ok:hover{background:#DDF2E0;border-color:#3E9B55;color:#1F5E31}
.qopt.bad,.qopt.bad:hover{background:#FBE0DA;border-color:#B4573F;color:#8C2F1E}

.qnext{margin-top:8px}
.qres{text-align:center;padding:6px 0 4px}

.dtools{text-align:center;margin:0 0 10px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.dcard{position:relative;border:2px solid #F6DFAE;background:#FFFDF7;border-radius:14px;padding:8px 12px 10px;text-align:center;cursor:pointer}
.dcard:hover{border-color:#E0A33C}

.dcard .dt{color:#B4573F;font-weight:700;font-size:14px}
.dcard .dm{color:#4A3E31;font-size:15px;margin-top:2px}
.dcard .dn{position:absolute;top:6px;left:8px;background:#F6DFAE;color:#08484C;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.dgrid.hid .dcard:not(.show) .dt{visibility:hidden}
.dgrid.hid .dcard:not(.show) .dm{font-size:0;line-height:0}
.dgrid.hid .dcard:not(.show) .dm::before{content:'tap to see';display:block;font-size:14px;line-height:1.5;color:#8C7F70;font-style:italic;text-align:center}

.bar button,.ibtn{width:50px;height:50px;padding:0;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.bar{gap:12px}
#know{font-size:26px}

.dots{flex-wrap:wrap;padding:0 18px 18px}

-13 0 -13 Q 10 -13 10 0 L 10 22 H -10 Z\" fill=\"#2F4A6B\"/><path d=\"M -2 -12 l 2 10 l 2 -10 Z\" fill=\"#B3261E\"/><rect x=\"12\" y=\"8\" width=\"16\" height=\"12\" rx=\"2\" fill=\"#8A5A2B\"/></g></g><g stroke=\"#B3261E\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" class=\"say\"><path d=\"M 106 104 q 18 4 32 -4\"/></g><g stroke=\"#2F4A6B\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" class=\"say\"><path d=\"M 296 124 q -16 -2 -28 -10\"/></g><text x=\"66\" y=\"44\" font-size=\"14\" fill=\"#8C2F1E\" font-weight=\"700\" text-anchor=\"middle\">from the jinn</text><text x=\"334\" y=\"44\" font-size=\"14\" fill=\"#2F4A6B\" font-weight=\"700\" text-anchor=\"middle\">and from people</text><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">from among jinn and humankind</text>"}, {"kind": "story", "ay": 0, "label": "Side story", "title": "Side story &mdash; Karim and the whispers", "tr": "", "note": "", "svg": "<rect x=\"0\" y=\"0\" width=\"400\" height=\"180\" fill=\"#F3EBFA\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"42\" fill=\"#8A6A44\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"9\" fill=\"#5E9E5A\"/><path d=\"M 30 178 V 106.0 Q 80.0 28.0 130 106.0 V 178 Z\" fill=\"#F6DFAE\" stroke=\"#B88A1E\" stroke-width=\"3\"/><g transform=\"translate(112,160) scale(1.5)\"><g class=\"hop\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><path d=\"M 124 128 l 14 -28\" stroke=\"#0E6B70\" stroke-width=\"5\" stroke-linecap=\"round\"/><g transform=\"translate(228,112) scale(1.2)\"><g class=\"lean\"><path d=\"M -14 -10 Q -30 -24 -26 -4 Q -20 -8 -14 -4 Z M 14 -10 Q 30 -24 26 -4 Q 20 -8 14 -4 Z\" fill=\"#B3261E\" stroke=\"#6E150F\" stroke-width=\"2\"/><ellipse cx=\"0\" cy=\"6\" rx=\"12\" ry=\"15\" fill=\"#D8412F\" stroke=\"#6E150F\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"-14\" r=\"11\" fill=\"#D8412F\" stroke=\"#6E150F\" stroke-width=\"2\"/><path d=\"M -8 -22 L -12 -34 L -3 -26 Z M 8 -22 L 12 -34 L 3 -26 Z\" fill=\"#B3261E\" stroke=\"#6E150F\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><circle cx=\"-4\" cy=\"-15\" r=\"1.8\" fill=\"#fff\"/><circle cx=\"4\" cy=\"-15\" r=\"1.8\" fill=\"#fff\"/><path d=\"M -5 -8 Q 0 -3 5 -8\" stroke=\"#6E150F\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M 10 20 Q 24 28 28 14\" stroke=\"#B3261E\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></g></g><path d=\"M 214 100 L 142 98\" stroke=\"#B3261E\" stroke-width=\"4\" stroke-linecap=\"round\" class=\"say\"/><g class=\"grow\"><rect x=\"150\" y=\"14\" width=\"240\" height=\"34\" rx=\"12\" fill=\"#fff\" stroke=\"#8C2F1E\" stroke-width=\"3\"/><path d=\"M 256.0 47 l 8 14 l 10 -14 Z\" fill=\"#fff\" stroke=\"#8C2F1E\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"258.0\" y=\"45\" width=\"12\" height=\"5\" fill=\"#fff\"/><text x=\"270.0\" y=\"35.166666666666664\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8C2F1E\" font-weight=\"700\">Waaait! Maybe someone else will do it...</text></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#5B3F17\" font-weight=\"700\" class=\"fadein\">Karim and the whispers</text>", "en": "<p>Karim went to <em>Jumu&rsquo;ah</em> one day before Ramadan. The Imam spoke about the reward for sponsoring <em>iftars</em>, and asked who wanted to sponsor the first day. Karim was motivated. He tried to raise his hand, but <em>Shaytan</em> pulled it down, whispering, &ldquo;Waaait! Maybe someone else will do it.&rdquo;</p>\n<p>But Karim wanted to be the first sponsor, so <em>Shaytan</em> had to come up with another argument. He whispered, &ldquo;If you donate, people will think you are showing off.&rdquo; Karim replied, &ldquo;Allah already knows my intention.&rdquo; <em>Shaytan</em> didn&rsquo;t give up. He whispered, &ldquo;You forgot your credit card.&rdquo; Karim responded, &ldquo;I will bring cash tomorrow.&rdquo; <em>Shaytan</em> then said, &ldquo;Okay! One more thing. Why don&rsquo;t you sen&hellip;&rdquo; Karim interrupted him and started reciting <em>Ayah Kursi</em>, and <em>poof</em>&mdash;<em>Shaytan</em> was gone. Now Karim was able to raise his hand with ease. And the Imam made a lovely <em>du&rsquo;a</em> for him and his family.</p>\n<p>On the way home, Karim stopped by his friend Amin&rsquo;s house and told him about the plan. Amin tried to talk him out of it, one argument after another: the Imam&rsquo;s voice is horrible, the people don&rsquo;t deserve to eat, and what about paying for your kids&rsquo; education? Karim was speechless. Nobody knew that <em>Shaytan</em> was sitting in the corner taking notes from Amin&rsquo;s arguments.</p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>We should pray to Allah, the Lord of everything, to protect us from the secret plans of evil humans and jinn.</li>\n<li>Some humans try to get us to do bad things. We should stay away from them.</li>\n<li>Because we learn from our friends, we should choose them carefully. We are as good or bad as our friends.</li>\n</ul>"}, {"kind": "story", "ay": 0, "label": "Words of wisdom", "title": "Words of wisdom", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#E3F2FB\"/><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"70\" fill=\"#fff\" opacity=\".6\"/></g><g class=\"beat\"><polygon points=\"150,66 250,66 282,102 200,176 118,102\" fill=\"#B05BC8\" stroke=\"#6E2F86\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 118 102 H 282 M 150 66 L 176 102 L 200 66 L 224 102 L 250 66 M 176 102 L 200 176 L 224 102\" stroke=\"#E9C8F4\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\"/></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"80\" cy=\"50\" r=\"6\"/><circle class=\"t2\" cx=\"330\" cy=\"56\" r=\"6\"/><circle class=\"t3\" cx=\"350\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"60\" cy=\"130\" r=\"4.5\"/><circle class=\"t2\" cx=\"200\" cy=\"30\" r=\"5\"/></g>", "en": "<p>This <em>surah</em> talks about devilish humans and jinn. Although we can&rsquo;t see evil jinn who whisper to us, they are easier to deal with. Once we remember Allah, ask for His protection, and recite <em>Ayah Kursi</em> (2:255), they leave us alone.</p>\n<p>As for evil humans, they are always around us and have a direct impact on our lives. How do we know them? They are the people who encourage us to do evil and stop us from doing good. We know them personally, so they are hard to avoid.</p>"}, {"kind": "quiz", "ay": 0, "quiz": true, "label": "Quiz", "title": "Quiz time!", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\"><path d=\"M 200 0 L 120 200 L 280 200 Z\" fill=\"url(#ray)\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"64\" fill=\"#F2C94C\" opacity=\".35\"/></g><g class=\"beat\"><path d=\"M 150 50 h 100 v 34 a 50 50 0 0 1 -100 0 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 150 60 h -22 q -4 34 28 40 M 250 60 h 22 q 4 34 -28 40\" stroke=\"#9A6C1E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"130\" width=\"20\" height=\"26\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"3\"/><rect x=\"164\" y=\"156\" width=\"72\" height=\"14\" rx=\"4\" fill=\"#8A6A44\" stroke=\"#5E4730\" stroke-width=\"3\"/><path transform=\"translate(200,86) scale(.9)\" d=\"M 0 -24 l 7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 Z\" fill=\"#fff\" stroke=\"#9A6C1E\" stroke-width=\"2\"/></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"80\" cy=\"50\" r=\"6\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"140\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"140\" r=\"4.5\"/><circle class=\"t2\" cx=\"120\" cy=\"190\" r=\"4\"/><circle class=\"t3\" cx=\"290\" cy=\"190\" r=\"4\"/></g><rect x=\"0\" y=\"176\" width=\"0\" height=\"0\"/>", "en": "<div id=\"quiz\"></div>"}, {"kind": "dict", "ay": 0, "label": "Word d var i = 0;
var known = [];
for (var k = 0; k < A.length; k++) { known.push(false); }
function $(id){ return document.getElementById(id); }

var dots = $('dots');
for (var n = 0; n < A.length; n++) {
  (function(n){
    var b = document.createElement('button');
    b.className = 'dot';
    b.title = A[n].label.replace(' of 6','');
    b.onclick = function(){ i = n; render(); };
    dots.appendChild(b);
  })(n);
}

function render(){
  stopAudio();
  var a = A[i];
  var isAy = a.ay > 0;
  $('stage').innerHTML = '<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">' + a.svg + '</svg>';
  $('ar').className = isAy ? 'ar' : 'ar head';
  $('ar').innerHTML = isAy ? a.ar : a.title;
  $('tr').innerHTML = a.tr;
  $('tr').style.display = isAy ? '' : 'none';
  $('en').className = isAy ? 'en' : 'en story';
  $('en').innerHTML = a.en;
  $('note').innerHTML = a.note;
  $('note').style.display = a.note ? '' : 'none';
  $('count').innerHTML = a.label;
  $('listen').style.display = isAy ? '' : 'none';
  $('know').style.display = isAy ? '' : 'none';
  if (a.quiz) { initQuiz(); }
  $('prev').disabled = (i === 0);
  $('next').disabled = (i === A.length - 1);
  if (A[i].ay > 0) $('know').innerHTML = known[i] ? '★' : '☆';
  $('know').className = known[i] ? 'on' : '';
  var ds = dots.childNodes;
  for (var n = 0; n < ds.length; n++) {
    var cls = 'dot';
    if (n === i) { cls += ' on'; }
    else if (known[n]) { cls += ' done'; }
    ds[n].className = cls;
  }
}
$('prev').onclick = function(){ if (i > 0) { i--; render(); } };
$('next').onclick = function(){ if (i < A.length - 1) { i++; render(); } };
$('replay').onclick = function(){ render(); };
$('know').onclick = function(){ known[i] = !known[i]; render(); };
document.onkeydown = function(e){
  e = e || window.event;
  if (e.keyCode === 39) { $('next').onclick(); }
  if (e.keyCode === 37) { $('prev').onclick(); }
};

var qi = 0, qscore = 0, qdone = false, qcur = [];
function shuf(a){ for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
function initQuiz(){ qi = 0; qscore = 0; showQ(); }
function showQ(){
  var q = QZ[qi]; qdone = false;
  qcur = [];
  for (var k = 0; k < q.o.length; k++) { qcur.push({t: q.o[k], c: k === q.a}); }
  if (!q.keep) { shuf(qcur); }
  var h = '<div class="qhead"><span>Question ' + (qi + 1) + ' of ' + QZ.length + '</span><span>Score: ' + qscore + '</span></div>';
  h += '<div class="qq">' + q.q + '</div>';
  for (var m = 0; m < qcur.length; m++) {
    h += '<button class="qopt' + (q.ar ? ' qar' : '') + '" onclick="qPick(' + m + ')">' + qcur[m].t + '</button>';
  }
  h += '<div class="qfb" id="qfb" style="display:none"></div><button class="qnext ibtn" id="qnext" title="Next question" aria-label="Next question" style="display:none" onclick="qNext()">&rarr;</button>';
  $('quiz').innerHTML = h;
}
function qPick(m){
  if (qdone) { return; }
  qdone = true;
  var q = QZ[qi], btns = $('quiz').getElementsByClassName('qopt');
  for (var k = 0; k < btns.length; k++) {
    if (qcur[k].c) { btns[k].className += ' ok'; }
    else if (k === m) { btns[k].className += ' bad'; }
    else { btns[k].className += ' dim'; }
  }
  var good = qcur[m].c;
  if (good) { qscore++; }
  var fb = $('qfb');
  fb.style.display = '';
  fb.innerHTML = (good ? '\u2705 <b>Correct!</b> ' : '\u274C <b>Not quite.</b> ') + q.why;
  var nx = $('qnext');
  nx.style.display = '';
  nx.title = qi === QZ.length - 1 ? 'See my score' : 'Next question'; nx.innerHTML = qi === QZ.length - 1 ? '\uD83C\uDFC1' : '\u2192';
}
function qNext(){
  if (qi < QZ.length - 1) { qi++; showQ(); return; }
  var n = QZ.length, st = '';
  for (var k = 0; k < n; k++) { st += k < qscore ? '\u2605' : '\u2606'; }
  var msg = qscore === n ? 'Perfect! MashaAllah, you know Surah An-Nas very well!' : qscore >= n - 2 ? 'Great job! Just a little more practice.' : qscore >= n / 2 ? 'Good try! Look at the slides again and try once more.' : 'Keep going! Read the story and the ayahs again, then try the quiz.';
  $('quiz').innerHTML = '<div class="qres"><div class="big">' + qscore + ' / ' + n + '</div><div class="stars">' + st + '</div><p>' + msg + '</p><button class="ibtn" title="Try again" aria-label="Try again" onclick="initQuiz()">\u21BB</button></div>';
}

/* ---- Audio: Sheikh Dr. Ayman Swaid (Sowaid) ---- */
var SURAH = 114;
var REC = 'Ayman_Sowaid_64kbps';
var au = new Audio();
au.preload = 'auto';
var stage = 0;
function pad3(n){ return ('00' + n).slice(-3); }
function audioName(){ return pad3(SURAH) + pad3(A[i].ay) + '.mp3'; }
function status(t){ $('astat').innerHTML = t; }
function setListen(on){ $('listen').title = on ? 'Stop' : 'Listen'; $('listen').innerHTML = on ? '\u23F8' : '\uD83D\uDD0A'; $('listen').className = on ? 'on' : ''; }
function stopAudio(){ try { au.pause(); } catch(e){} au.onerror = null; au.removeAttribute('src'); setListen(false); status(''); }
function tryPlay(){
  var url = stage === 0 ? 'audio/' + audioName() : 'https://everyayah.com/data/' + REC + '/' + audioName();
  au.src = url;
  var p = au.play();
  if (p && p.catch) { p.catch(function(err){
    if (err && err.name === 'NotAllowedError') { setListen(false); status('Your browser blocked the sound. Tap Listen again.'); }
  }); }
}
au.onended = function(){ setListen(false); status(''); };
au.onplaying = function(){ status(''); };
function onAuError(){
  if (stage === 0) { stage = 1; tryPlay(); }
  else { stage = 2; setListen(false); status('Could not load the recitation. Check your internet connection, or put the mp3 files in a folder named &ldquo;audio&rdquo; next to this page (for example ' + audioName() + ').'); }
}
$('listen').onclick = function(){
  if (!au.paused && au.getAttribute('src')) { stopAudio(); return; }
  stage = 0;
  au.onerror = onAuError;
  setListen(true);
  status('Loading&hellip;');
  tryPlay();
};

render();

/* Surah Lessons: "repeat this ayah 5 times" button next to Listen */
(function(){
  var REPEATS = 5, left = 0, listen = document.getElementById('listen');
  if (!listen || typeof au === 'undefined') { return; }
  var btn = document.createElement('button'), iconOnly = !/[A-Za-z]/.test(listen.textContent);
  btn.id = 'repeat'; btn.title = 'Repeat this ayah 5 times'; btn.setAttribute('aria-label', 'Repeat this ayah 5 times');
  if (iconOnly) { btn.style.fontSize = '15px'; }
  listen.parentNode.insertBefore(btn, listen.nextSibling);
  var st = document.createElement('style'); st.textContent = '#repeat.on{background:#0E6B70;color:#fff}' + (iconOnly ? '@media (max-width:480px){.bar{gap:8px}.bar button{width:44px;height:44px;font-size:19px}#repeat{font-size:13px}#know{font-size:22px}}' : ''); document.head.appendChild(st);
  function label(on){
    var n = REPEATS - left + 1;
    btn.innerHTML = on ? (iconOnly ? n + '/' + REPEATS : '\u23F8 ' + n + ' of ' + REPEATS) : (iconOnly ? '\uD83D\uDD01' + REPEATS : '\uD83D\uDD01 Repeat \u00D7' + REPEATS);
    btn.className = on ? 'on' : '';
  }
  label(false);
  var stop0 = stopAudio;
  stopAudio = function(){ left = 0; label(false); return stop0.apply(this, arguments); };
  var ended0 = au.onended;
  au.onended = function(){
    if (left > 1) { left--; label(true); au.currentTime = 0; var p = au.play(); if (p && p.catch) { p.catch(function(){ stopAudio(); }); } return; }
    left = 0; label(false); if (ended0) { ended0.apply(this, arguments); }
  };
  btn.onclick = function(){
    if (left > 0) { stopAudio(); return; }
    stopAudio(); left = REPEATS; stage = 0; au.onerror = onAuError; setListen(true); status('Loading&hellip;'); label(true); tryPlay();
  };
})();
</script>
<script>
/* Surah Lessons website: reports which ayahs were watched or marked "I know it" (does nothing when this page is opened on its own) */
(function(){
  var SL_ID = 114, map = [], N = 0, seen = {};
  for (var x = 0; x < A.length; x++) { var ay = (A[x].ay === undefined) ? x + 1 : A[x].ay; map.push(ay); if (ay > 0) { N++; } }
  function post(m){ try { if (window.parent && window.parent !== window) { window.parent.postMessage(m, '*'); } } catch (e) {} }
  function report(){
    var k = [], v = [];
    for (var x = 0; x < A.length; x++) { if (map[x] > 0) { if (known[x]) { k.push(map[x]); } if (seen[x]) { v.push(map[x]); } } }
    post({type: 'sl-anim', surahId: SL_ID, total: N, viewed: v, known: k});
  }
  var r0 = render;
  render = function(){ var res = r0.apply(this, arguments); seen[i] = 1; report(); return res; };
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'sl-state' || d.surahId !== SL_ID) { return; }
    for (var x = 0; x < A.length; x++) {
      var ay = map[x];
      if (ay > 0) { if (d.known && d.known.indexOf(ay) >= 0) { known[x] = true; } if (d.viewed && d.viewed.indexOf(ay) >= 0) { seen[x] = 1; } }
    }
    r0(); seen[i] = 1; report();
  });
  seen[i] = 1; post({type: 'sl-ready', surahId: SL_ID}); report();
})();
</script>
