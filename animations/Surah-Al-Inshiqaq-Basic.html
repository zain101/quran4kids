*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}
.ar{font-family:'AmiriSub',serif;direction:rtl;font-size:38px;font-size:clamp(28px,6.6vw,42px);
 line-height:2.05;color:#08484C;margin:2px 0 10px}
.tr{color:#B4573F;font-weight:700;font-size:16px;font-size:clamp(13px,3vw,16px);margin-bottom:6px}
.en{color:#4A3E31;font-size:17px;font-size:clamp(14px,3.2vw,17px);line-height:1.5}
.note{margin:12px auto 0;max-width:520px;background:#F5EAD6;border-radius:12px;
 padding:9px 14px;font-size:13.5px;color:#6B5A46}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;
 padding:14px 18px 18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;
 border:2px solid #0E6B70;background:#fff;color:#0E6B70;padding:11px 20px;font-size:15px}
button:hover{background:#0E6B70;color:#fff}
button:disabled{opacity:.32;cursor:default}
button:disabled:hover{background:#fff;color:#0E6B70}
#replay{border-color:#E0A33C;color:#9A6C1E}
#replay:hover{background:#E0A33C;color:#fff}
#know{border-color:#E0A33C;color:#9A6C1E}
#know.on{background:#E0A33C;color:#fff}
#know.on:hover{background:#E0A33C;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 18px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #E0A33C;background:#fff;
 cursor:pointer;padding:0}
.dot.on{background:#0E6B70;border-color:#0E6B70}
.dot.done{background:#E0A33C}
.hint{text-align:center;font-size:12px;color:#8C7F70;margin:12px 0 0}

@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
 20%{transform:translate(-5px,1px) rotate(-1.1deg)}40%{transform:translate(5px,-1px) rotate(1.1deg)}
 60%{transform:translate(-4px,2px) rotate(-.8deg)}80%{transform:translate(4px,-2px) rotate(.8deg)}}
.shake{animation:shake .42s infinite;transform-origin:200px 140px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.hop{animation:hop .42s infinite}.h2{animation-delay:.1s}.h3{animation-delay:.2s}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
.pulse{animation:pulse 1.1s infinite}
@keyframes rise{0%{transform:translateY(46px);opacity:0}
 25%{opacity:1}70%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.rise{animation:rise 2.6s infinite ease-out}
.r2{animation-delay:.35s}.r3{animation-delay:.7s}.r4{animation-delay:1.05s}.r5{animation-delay:1.4s}
@keyframes lean{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(6deg)}}
.lean{animation:lean 1.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes qm{0%{transform:translateY(14px) scale(.4);opacity:0}
 35%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.qm{animation:qm 2s infinite}.q2{animation-delay:.3s}.q3{animation-delay:.6s}
@keyframes grow{0%{transform:scale(.3);opacity:0}22%{transform:scale(1);opacity:1}100%{opacity:1}}
.grow{animation:grow 2.8s infinite;transform-box:fill-box;transform-origin:0% 60%}

nt></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"172\" fill=\"#CFEAF7\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"42\" fill=\"#8A6A44\"/><rect x=\"0\" y=\"178\" width=\"400\" height=\"9\" fill=\"#5E9E5A\"/><g class=\"glowarch\"><path d=\"M 164 172 v -76 a 36 36 0 0 1 72 0 v 76 Z\" fill=\"#F6DFAE\" stroke=\"#E0A33C\" stroke-width=\"4\"/></g><text x=\"200\" y=\"136\" font-size=\"44\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0E6B70\">&#8734;</text><rect x=\"46\" y=\"136\" width=\"8\" height=\"40\" fill=\"#6F5436\"/><circle cx=\"50\" cy=\"122\" r=\"24\" fill=\"#5E9E5A\"/><rect x=\"346\" y=\"136\" width=\"8\" height=\"40\" fill=\"#6F5436\"/><circle cx=\"350\" cy=\"122\" r=\"24\" fill=\"#5E9E5A\"/><g transform=\"translate(100,170) scale(1.4)\"><g class=\"hop\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><g transform=\"translate(300,172) scale(1.4)\"><g class=\"hop h2\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#B4573F\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#B4573F\"/></g></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"200\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"90\" cy=\"60\" r=\"5\"/><circle class=\"t3\" cx=\"320\" cy=\"64\" r=\"5\"/><circle class=\"t1\" cx=\"370\" cy=\"110\" r=\"4\"/></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">a reward that never ends</text>"}, {"kind": "story", "ay": 0, "label": "Side story", "title": "Side story &mdash; Yasmin's notebook", "tr": "", "note": "A simple story written to help us remember the lesson of this surah.", "svg": "<rect x=\"0\" y=\"0\" width=\"400\" height=\"172\" fill=\"#FFF3D8\"/><rect x=\"0\" y=\"172\" width=\"400\" height=\"48\" fill=\"#C99A5B\"/><rect x=\"30\" y=\"40\" width=\"80\" height=\"60\" fill=\"#CFEAF7\" stroke=\"#8A6A44\" stroke-width=\"4\"/><path d=\"M 70 40 V 100 M 30 70 H 110\" stroke=\"#8A6A44\" stroke-width=\"3\"/><g transform=\"translate(130,170) scale(1.5)\"><g class=\"\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#B4573F\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#B4573F\"/></g></g><text class=\"bob\" x=\"200\" y=\"140\" font-size=\"56\" text-anchor=\"middle\" >&#128211;</text><g class=\"bigstar\"><path transform=\"translate(240,86) scale(.7)\" d=\"M 0 -24 l 7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"2\"/></g><g transform=\"translate(290,172) scale(1.7)\"><g class=\"\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#0E6B70\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#0E6B70\"/></g></g><g fill=\"#B4573F\" font-size=\"22\"><text class=\"rise r1\" x=\"170\" y=\"110\">&#9829;</text><text class=\"rise r3\" x=\"260\" y=\"104\">&#9829;</text></g><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"60\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"350\" cy=\"60\" r=\"5\"/></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">Yasmin's good deeds notebook</text>", "en": "<p>Yasmin had a little notebook. Every evening before bed, she drew a star for each good thing she did that day: sharing her snack, helping her mum, saying sorry, or praying on time.</p>\n<p>One evening her little brother asked, &ldquo;Why do you write everything down?&rdquo; Yasmin smiled. &ldquo;Because Allah sees everything we do, and on the Day of Judgment everyone will get a record of their deeds. I want to meet Allah with a record full of good things.&rdquo;</p>\n<p>Her brother thought about it. &ldquo;Can I start my own notebook?&rdquo; he asked. They each made a notebook, and every night they proudly held them in their right hands, and said, &ldquo;Al-hamdu-lillah.&rdquo;</p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "These points were written to explain the surah. They are not from a book.", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>On the Day of Judgment the sky and the earth will obey Allah completely.</li>\n<li>Everyone is working towards meeting Allah, so we should do good now.</li>\n<li>People who are given their record in the right hand will have an easy judgment and be full of joy.</li>\n<li>Allah sees everything we do, even what we hide.</li>\n<li>Life moves from one stage to another, so we should be ready.</li>\n<li>When the Qur&rsquo;an is recited, we should listen with respect and bow down when we hear a prostration ayah.</li>\n<li>B var i = 0;
var known = [];
for (var k = 0; k < A.length; k++) { known.push(false); }
function $(id){ return document.getElementById(id); }

var dots = $('dots');
for (var n = 0; n < A.length; n++) {
  (function(n){
    var b = document.createElement('button');
    b.className = 'dot';
    b.title = A[n].label.replace(' of 25','');
    b.onclick = function(){ i = n; render(); };
    dots.appendChild(b);
  })(n);
}

function render(){
  stopAudio();
  var a = A[i];
  var isAy = a.ay > 0;
  $('stage').innerHTML = '<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">' + a.svg + '</svg>';
  $('ar').className = isAy ? 'ar' : 'ar head';
  $('ar').innerHTML = isAy ? a.ar : a.title;
  $('tr').innerHTML = a.tr;
  $('tr').style.display = isAy ? '' : 'none';
  $('en').className = isAy ? 'en' : 'en story';
  $('en').innerHTML = a.en;
  $('note').innerHTML = a.note;
  $('note').style.display = a.note ? '' : 'none';
  $('count').innerHTML = a.label;
  $('listen').style.display = isAy ? '' : 'none';
  $('know').style.display = isAy ? '' : 'none';
  if (a.quiz) { initQuiz(); }
  $('prev').disabled = (i === 0);
  $('next').disabled = (i === A.length - 1);
  if (A[i].ay > 0) $('know').innerHTML = known[i] ? '★' : '☆';
  $('know').className = known[i] ? 'on' : '';
  var ds = dots.childNodes;
  for (var n = 0; n < ds.length; n++) {
    var cls = 'dot';
    if (n === i) { cls += ' on'; }
    else if (known[n]) { cls += ' done'; }
    ds[n].className = cls;
  }
}
$('prev').onclick = function(){ if (i > 0) { i--; render(); } };
$('next').onclick = function(){ if (i < A.length - 1) { i++; render(); } };
$('replay').onclick = function(){ render(); };
$('know').onclick = function(){ known[i] = !known[i]; render(); };
document.onkeydown = function(e){
  e = e || window.event;
  if (e.keyCode === 39) { $('next').onclick(); }
  if (e.keyCode === 37) { $('prev').onclick(); }
};
/* ---- Interactive quiz ---- */
var QZ = [
 {q:'How many ayahs are in Surah Al-Inshiqaq?', o:['15','20','25','30'], a:2, why:'Surah Al-Inshiqaq has 25 ayahs.', keep:true},
 {q:'What will the sky do on the Day of Judgment?', o:['Split open and obey its Lord','Turn into gold','Disappear quietly','Fall like rain'], a:0, why:'Ayahs 1 and 2: the sky splits open and obeys its Lord.'},
 {q:'What will happen to the earth?', o:['It will be stretched out flat','It will become taller','It will turn to ice','It will move away'], a:0, why:'Ayah 3: the earth will be stretched out flat.'},
 {q:'In which hand will the record be given to those who will have an easy judgment?', o:['The right hand','The left hand','Behind the back','Above the head'], a:0, why:'Ayah 7: whoever is given their record in their right hand.'},
 {q:'How will the person with the right-hand record feel?', o:['Full of joy','Scared','Sleepy','Angry'], a:0, why:'Ayah 9: they return to their family full of joy.'},
 {q:'Who always sees what we do?', o:['Our Lord, Allah','Nobody','Only our friends','Only our teachers'], a:0, why:'Ayah 15: their Lord was always watching them.'},
 {q:'What does the surah say the moon will become?', o:['Full','Red','Small','Gone'], a:0, why:'Ayah 18: the moon when it becomes full.'},
 {q:'Life moves from one ____ to another.', o:['stage','house','city','book'], a:0, why:'Ayah 19: you will surely move from one stage to another.'},
 {q:'True or false: believers who do good deeds will have a reward that never ends.', o:['True','False'], a:0, why:'True. Ayah 25 promises a reward that never ends.', keep:true},
 {q:'Which ayah means: &ldquo;So what is wrong with them that they do not believe?&rdquo;', o:["فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ", "فَمَا لَهُمْ لَا يُؤْمِنُونَ", "وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ", "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ"], a:1, why:'This is ayah 20.', ar:true, keep:true}
];
var qi = 0, qscore = 0, qdone = false, qcur = [];
function shuf(a){ for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
function initQuiz(){ qi = 0; qscore = 0; showQ(); }
function showQ(){
  var q = QZ[qi]; qdone = false;
  qcur = [];
  for (var k = 0; k < q.o.length; k++) { qcur.push({t: q.o[k], c: k === q.a}); }
  if (!q.keep) { shuf(qcur); }
  var h = '<div class="qhead"><span>Question ' + (qi + 1) + ' of ' + QZ.length + '</span><span>Score: ' + qscore + '</span></div>';
  h += '<div class="qq">' + q.q + '</div>';
  for (var m = 0; m < qcur.length; m++) {
    h += '<button class="qopt' + (q.ar ? ' qar' : '') + '" onclick="qPick(' + m + ')">' + qcur[m].t + '</button>';
  }
  h += '<div class="qfb" id="qfb" style="display:none"></div><button class="qnext ibtn" id="qnext" title="Next question" aria-label="Next question" style="display:none" onclick="qNext()">&rarr;</button>';
  $('quiz').innerHTML = h;
}
function qPick(m){
  if (qdone) { return; }
  qdone = true;
  var q = QZ[qi], btns = $('quiz').getElementsByClassName('qopt');
  for (var k = 0; k < btns.length; k++) {
    if (qcur[k].c) { btns[k].className += ' ok'; }
    else if (k === m) { btns[k].className += ' bad'; }
    else { btns[k].className += ' dim'; }
  }
  var good = qcur[m].c;
  if (good) { qscore++; }
  var fb = $('qfb');
  fb.style.display = '';
  fb.innerHTML = (good ? '\u2705 <b>Correct!</b> ' : '\u274C <b>Not quite.</b> ') + q.why;
  var nx = $('qnext');
  nx.style.display = '';
  nx.title = qi === QZ.length - 1 ? 'See my score' : 'Next question'; nx.innerHTML = qi === QZ.length - 1 ? '\uD83C\uDFC1' : '\u2192';
}
function qNext(){
  if (qi < QZ.length - 1) { qi++; showQ(); return; }
  var n = QZ.length, st = '';
  for (var k = 0; k < n; k++) { st += k < qscore ? '\u2605' : '\u2606'; }
  var msg = qscore === n ? 'Perfect! MashaAllah, you know Surah Al-Inshiqaq very well!' : qscore >= n - 2 ? 'Great job! Just a little more practice.' : qscore >= n / 2 ? 'Good try! Look at the slides again and try once more.' : 'Keep going! Read the story and the ayahs again, then try the quiz.';
  $('quiz').innerHTML = '<div class="qres"><div class="big">' + qscore + ' / ' + n + '</div><div class="stars">' + st + '</div><p>' + msg + '</p><button class="ibtn" title="Try again" aria-label="Try again" onclick="initQuiz()">\u21BB</button></div>';
}

/* ---- Audio: Sheikh Dr. Ayman Swaid (Sowaid) ---- */
var SURAH = 84;
var REC = 'Ayman_Sowaid_64kbps';
var au = new Audio();
au.preload = 'auto';
var stage = 0;
function pad3(n){ return ('00' + n).slice(-3); }
function audioName(){ return pad3(SURAH) + pad3(A[i].ay) + '.mp3'; }
function status(t){ $('astat').innerHTML = t; }
function setListen(on){ $('listen').title = on ? 'Stop' : 'Listen'; $('listen').innerHTML = on ? '\u23F8' : '\uD83D\uDD0A'; $('listen').className = on ? 'on' : ''; }
function stopAudio(){ try { au.pause(); } catch(e){} au.onerror = null; au.removeAttribute('src'); setListen(false); status(''); }
function tryPlay(){
  var url = stage === 0 ? 'audio/' + audioName() : 'https://everyayah.com/data/' + REC + '/' + audioName();
  au.src = url;
  var p = au.play();
  if (p && p.catch) { p.catch(function(err){
    if (err && err.name === 'NotAllowedError') { setListen(false); status('Your browser blocked the sound. Tap Listen again.'); }
  }); }
}
au.onended = function(){ setListen(false); status(''); };
au.onplaying = function(){ status(''); };
function onAuError(){
  if (stage === 0) { stage = 1; tryPlay(); }
  else { stage = 2; setListen(false); status('Could not load the recitation. Check your internet connection, or put the mp3 files in a folder named &ldquo;audio&rdquo; next to this page (for example ' + audioName() + ').'); }
}
$('listen').onclick = function(){
  if (!au.paused && au.getAttribute('src')) { stopAudio(); return; }
  stage = 0;
  au.onerror = onAuError;
  setListen(true);
  status('Loading&hellip;');
  tryPlay();
};

render();
