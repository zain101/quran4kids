*{box-sizing:border-box}
body{margin:0;background:#FDF8EF;color:#33271C;
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:760px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;
 box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:14px 20px;display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.3px}
header .sub{font-size:12px;color:#F6DFAE;margin-top:2px}
.count{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;
 padding:6px 14px;font-size:14px;white-space:nowrap}
.stage{background:#EAF4F1;border-bottom:3px solid #F6DFAE;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.body{padding:18px 22px 4px;text-align:center}

"68\" fill=\"#F6DFAE\" stroke=\"#E0A33C\" stroke-width=\"3\"/><polygon points=\"14,104 58,66 102,104\" fill=\"#B4573F\" stroke=\"#7A3524\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"50\" y=\"136\" width=\"18\" height=\"36\" fill=\"#8A6A44\"/><g transform=\"translate(160,170) scale(1.6)\"><g class=\"lean\"><circle cx=\"0\" cy=\"-20\" r=\"7.5\" fill=\"#7A5C3A\"/><path d=\"M -8 0 Q -8 -13 0 -13 Q 8 -13 8 0 L 8 14 Q 0 18 -8 14 Z\" fill=\"#7A5C3A\"/></g></g><path d=\"M 148 128 q 12 -14 24 0\" fill=\"#fff\" stroke=\"#CFC8BC\" stroke-width=\"2\"/><path d=\"M 176 150 L 212 148\" stroke=\"#7A5C3A\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M 204 136 h 44 v 8 q 0 22 -22 22 q -22 0 -22 -22 Z\" fill=\"#6F6F6F\" stroke=\"#3A3A3A\" stroke-width=\"3\"/><path d=\"M 198 140 q -10 6 0 14 M 254 140 q 10 6 0 14\" stroke=\"#3A3A3A\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><g class=\"hop\"><path d=\"M 262 150 h 18 q 0 12 -9 12 q -9 0 -9 -12 Z\" fill=\"#9A9A9A\" stroke=\"#3A3A3A\" stroke-width=\"2\"/></g><g class=\"hop h2\"><path d=\"M 284 154 h 18 q 0 12 -9 12 q -9 0 -9 -12 Z\" fill=\"#9A9A9A\" stroke=\"#3A3A3A\" stroke-width=\"2\"/></g><g class=\"hop h3\"><path d=\"M 306 150 h 18 q 0 12 -9 12 q -9 0 -9 -12 Z\" fill=\"#9A9A9A\" stroke=\"#3A3A3A\" stroke-width=\"2\"/></g><text x=\"200\" y=\"206\" font-size=\"16\" text-anchor=\"middle\" fill=\"#FDF8EF\" font-weight=\"700\" class=\"fadein\">Joha and the pots</text>", "en": "<p>Joha moved with his family to a small village. One day, he received guests and had to borrow some oil, onions, and pots. But none of his neighbours wanted to share anything with him. He tried to buy new pots, but couldn&rsquo;t find any for sale. So, he had to trick his neighbours to take their pots. He told them, &ldquo;If you give me the pots, they will give birth to small bowls.&rdquo;</p>\n<p>Finally, one neighbour agreed to give him two big pots. The next day, Joha returned the pots with 3 small bowls from his own kitchen. Now, everyone in the village was begging Joha to borrow their pots. On his daughter&rsquo;s wedding day, he had no trouble collecting 35 pots.</p>\n<p>After the wedding, people came with big smiles to take back their pots and the baby bowls. But Joha told them that he had some bad news. He said, &ldquo;Unfortunately, all the pots have died.&rdquo; They asked in shock, &ldquo;Are you kidding us? How can pots die?&rdquo; He answered, &ldquo;If they can give birth, they sure can die!&rdquo;</p>"}, {"kind": "story", "ay": 0, "label": "Learning points", "title": "Learning points", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\" stroke=\"#F2C94C\" stroke-width=\"6\" stroke-linecap=\"round\"><path d=\"M 200 22 v -14 M 200 168 v 14 M 120 95 h -18 M 280 95 h 18 M 143 38 l -12 -12 M 257 38 l 12 -12 M 143 152 l -12 12 M 257 152 l 12 12\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"95\" r=\"62\" fill=\"#F2C94C\" opacity=\".35\"/></g><path d=\"M 200 40 a 40 40 0 0 1 24 72 v 14 h -48 v -14 a 40 40 0 0 1 24 -72 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"178\" y=\"128\" width=\"44\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><rect x=\"184\" y=\"139\" width=\"32\" height=\"9\" rx=\"3\" fill=\"#8A6A44\"/><path d=\"M 188 112 q 12 -28 24 0\" stroke=\"#9A6C1E\" stroke-width=\"3\" fill=\"none\"/><g fill=\"#E0A33C\" class=\"tw\"><circle class=\"t1\" cx=\"90\" cy=\"50\" r=\"5\"/><circle class=\"t2\" cx=\"320\" cy=\"60\" r=\"6\"/><circle class=\"t3\" cx=\"340\" cy=\"130\" r=\"4.5\"/><circle class=\"t1\" cx=\"70\" cy=\"130\" r=\"4\"/><circle class=\"t2\" cx=\"200\" cy=\"200\" r=\"4\"/></g>", "en": "<ul>\n<li>A true believer keeps a good relationship with Allah and the people.</li>\n<li>The idol-worshippers who deny judgment do not see the point in feeding the poor and being nice to the orphan.</li>\n<li>The hypocrites only pray to show off. When they pray, they think it is just a waste of time. This is why they always delay their prayers with no excuse.</li>\n<li>It is important to pray on time and pay attention in <em>salah</em>.</li>\n<li>If we pray properly, this should improve our attitude towards others.</li>\n<li>The hypocrites only live for themselves. They don&rsquo;t pay their <em>zakah</em>, or even allow their neighbours to borrow small household items such as pots, onions, salt, and so on.</li>\n</ul>"}, {"kind": "quiz", "ay": 0, "quiz": true, "label": "Quiz", "title": "Quiz time!", "tr": "", "note": "", "svg": "<defs><linearGradient id=\"ray\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F2C94C\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#F2C94C\" stop-opacity=\"0\"/></linearGradient></defs><rect x=\"0\" y=\"0\" width=\"400\" height=\"220\" fill=\"#FFF8E1\"/><g class=\"rays\"><path d=\"M 200 0 L 120 200 L 280 200 Z\" fill=\"url(#ray)\"/></g><g class=\"glowarch\"><circle cx=\"200\" cy=\"100\" r=\"64\" fill=\"#F2C94C\" opacity=\".35\"/></g><g class=\"beat\"><path d=\"M 150 50 h 100 v 34 a 50 50 0 0 1 -100 0 Z\" fill=\"#F2C94C\" stroke=\"#9A6C1E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M 150 60 h -22 q -4 34 28 40 M 250 60 h 22 q 4 34 -28 40\" stroke=\"#9A6C1E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"130\" width=\"20\" height=\"26\" fill=\"#E0A33C\" stroke=\"#9A6C1E\" stroke-width=\"3\"/><rect x=\"164\" y=\"156\" width=\"72\" height=\"14\" rx=\"4\" fill=\"#8A6A44\" stroke=\"#5E4730\" stroke-width=\"3\"/><path transform=\"translate(200,86) scale(.9)\" d=\"M 0 -24 l 7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 Z\" fill=\"#fff\" stroke=\"#9A6C1E\" stroke-width=\"2\"/></g><g fill=\"#E0A33C\" class=\"tw var i = 0;
var known = [];
for (var k = 0; k < A.length; k++) { known.push(false); }
function $(id){ return document.getElementById(id); }

var dots = $('dots');
for (var n = 0; n < A.length; n++) {
  (function(n){
    var b = document.createElement('button');
    b.className = 'dot';
    b.title = A[n].label.replace(' of 7','');
    b.onclick = function(){ i = n; render(); };
    dots.appendChild(b);
  })(n);
}

function render(){
  stopAudio();
  var a = A[i];
  var isAy = a.ay > 0;
  $('stage').innerHTML = '<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">' + a.svg + '</svg>';
  $('ar').className = isAy ? 'ar' : 'ar head';
  $('ar').innerHTML = isAy ? a.ar : a.title;
  $('tr').innerHTML = a.tr;
  $('tr').style.display = isAy ? '' : 'none';
  $('en').className = isAy ? 'en' : 'en story';
  $('en').innerHTML = a.en;
  $('note').innerHTML = a.note;
  $('note').style.display = a.note ? '' : 'none';
  $('count').innerHTML = a.label;
  $('listen').style.display = isAy ? '' : 'none';
  $('know').style.display = isAy ? '' : 'none';
  if (a.quiz) { initQuiz(); }
  $('prev').disabled = (i === 0);
  $('next').disabled = (i === A.length - 1);
  if (A[i].ay > 0) $('know').innerHTML = known[i] ? '★' : '☆';
  $('know').className = known[i] ? 'on' : '';
  var ds = dots.childNodes;
  for (var n = 0; n < ds.length; n++) {
    var cls = 'dot';
    if (n === i) { cls += ' on'; }
    else if (known[n]) { cls += ' done'; }
    ds[n].className = cls;
  }
}
$('prev').onclick = function(){ if (i > 0) { i--; render(); } };
$('next').onclick = function(){ if (i < A.length - 1) { i++; render(); } };
$('replay').onclick = function(){ render(); };
$('know').onclick = function(){ known[i] = !known[i]; render(); };
document.onkeydown = function(e){
  e = e || window.event;
  if (e.keyCode === 39) { $('next').onclick(); }

};

var QZ = [
 {q:'What does Surah Al-Ma&rsquo;un say we should not refuse?', o:['Even the smallest favours','Only big gifts','Only money','Nothing at all'], a:0, why:'Ayah 7: refuse to do even the smallest favours.'},

];
var qi = 0, qscore = 0, qdone = false, qcur = [];
function shuf(a){ for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
function initQuiz(){ qi = 0; qscore = 0; showQ(); }
function showQ(){
  var q = QZ[qi]; qdone = false;
  qcur = [];
  for (var k = 0; k < q.o.length; k++) { qcur.push({t: q.o[k], c: k === q.a}); }
  if (!q.keep) { shuf(qcur); }
  var h = '<div class="qhead"><span>Question ' + (qi + 1) + ' of ' + QZ.length + '</span><span>Score: ' + qscore + '</span></div>';
  h += '<div class="qq">' + q.q + '</div>';
  for (var m = 0; m < qcur.length; m++) {
    h += '<button class="qopt' + (q.ar ? ' qar' : '') + '" onclick="qPick(' + m + ')">' + qcur[m].t + '</button>';
  }
  h += '<div class="qfb" id="qfb" style="display:none"></div><button class="qnext ibtn" id="qnext" title="Next question" aria-label="Next question" style="display:none" onclick="qNext()">&rarr;</button>';
  $('quiz').innerHTML = h;
}
function qPick(m){
  if (qdone) { return; }
  qdone = true;
  var q = QZ[qi], btns = $('quiz').getElementsByClassName('qopt');
  for (var k = 0; k < btns.length; k++) {
    if (qcur[k].c) { btns[k].className += ' ok'; }
    else if (k === m) { btns[k].className += ' bad'; }
    else { btns[k].className += ' dim'; }
  }
  var good = qcur[m].c;
  if (good) { qscore++; }
  var fb = $('qfb');
  fb.style.display = '';
  fb.innerHTML = (good ? '\u2705 <b>Correct!</b> ' : '\u274C <b>Not quite.</b> ') + q.why;
  var nx = $('qnext');
  nx.style.display = '';
  nx.title = qi === QZ.length - 1 ? 'See my score' : 'Next question'; nx.innerHTML = qi === QZ.length - 1 ? '\uD83C\uDFC1' : '\u2192';
}
function qNext(){
  if (qi < QZ.length - 1) { qi++; showQ(); return; }
  var n = QZ.length, st = '';
  for (var k = 0; k < n; k++) { st += k < qscore ? '\u2605' : '\u2606'; }
  var msg = qscore === n ? 'Perfect! MashaAllah, you know Surah Al-Ma&rsquo;un very well!' : qscore >= n - 2 ? 'Great job! Just a little more practice.' : qscore >= n / 2 ? 'Good try! Look at the slides again and try once more.' : 'Keep going! Read the story and the ayahs again, then try the quiz.';
  $('quiz').innerHTML = '<div class="qres"><div class="big">' + qscore + ' / ' + n + '</div><div class="stars">' + st + '</div><p>' + msg + '</p><button class="ibtn" title="Try again" aria-label="Try again" onclick="initQuiz()">\u21BB</button></div>';
}

var SURAH = 107;
var REC = 'Ayman_Sowaid_64kbps';
var au = new Audio();
au.preload = 'auto';
var stage = 0;
function pad3(n){ return ('00' + n).slice(-3); }
function audioName(){ return pad3(SURAH) + pad3(A[i].ay) + '.mp3'; }
function status(t){ $('astat').innerHTML = t; }
function setListen(on){ $('listen').title = on ? 'Stop' : 'Listen'; $('listen').innerHTML = on ? '\u23F8' : '\uD83D\uDD0A'; $('listen').className = on ? 'on' : ''; }
function stopAudio(){ try { au.pause(); } catch(e){} au.onerror = null; au.removeAttribute('src'); setListen(false); status(''); }
function tryPlay(){
  var url = stage === 0 ? 'audio/' + audioName() : 'https://everyayah.com/data/' + REC + '/' + audioName();
  au.src = url;
  var p = au.play();
  if (p && p.catch) { p.catch(function(err){
    if (err && err.name === 'NotAllowedError') { setListen(false); status('Your browser blocked the sound. Tap Listen again.'); }
  }); }
}
au.onended = function(){ setListen(false); status(''); };
au.onplaying = function(){ status(''); };
function onAuError(){
  if (stage === 0) { stage = 1; tryPlay(); }
  else { stage = 2; setListen(false); status('Could not load the recitation. Check your internet connection, or put the mp3 files in a folder named &ldquo;audio&rdquo; next to this page (for example ' + audioName() + ').'); }
}
$('listen').onclick = function(){
  if (!au.paused && au.getAttribute('src')) { stopAudio(); return; }
  stage = 0;
  au.onerror = onAuError;
  setListen(true);
  status('Loading&hellip;');
  tryPlay();
};
