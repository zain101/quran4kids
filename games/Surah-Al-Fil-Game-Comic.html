:root{--ink:#111;--yellow:#FFD93D;--red:#FF4B3E;--blue:#3AA0FF;--green:#7ED957;--paper:#FFF4D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px 10px 30px;background:var(--paper);background-image:radial-gradient(rgba(255,75,62,.18) 1.6px,transparent 1.8px);background-size:14px 14px;
 font-family:'ComicNeue','Comic Sans MS','Chalkboard SE',cursive,sans-serif;color:var(--ink);display:flex;justify-content:center;font-weight:700}
.app{width:100%;max-width:620px}
.card{background:#fff;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:10px}
header{display:flex;align-items:center;gap:10px;background:var(--red);border:4px solid var(--ink);padding:6px 10px;margin-bottom:10px}
header h1{margin:0;flex:1;font-family:'Bangers',Impact,sans-serif;font-weight:400;font-size:27px;letter-spacing:1.5px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.stars{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:'Bangers',sans-serif;font-size:19px;letter-spacing:1px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.ibtn{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);font-size:21px;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);transition:transform .08s;font-family:inherit}
.ibtn:hover{background:var(--blue);color:#fff}
.ibtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.screen{display:none}.screen.on{display:block;animation:pageIn .4s ease-out both}
@keyframes pageIn{from{opacity:0;transform:translateX(24px) rotate(.8deg)}to{opacity:1;transform:none}}
.menu h2{margin:4px 0 2px;text-align:center;font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.menu p{text-align:center;margin:6px 0 12px}
.gbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:4px solid var(--ink);background:#fff;padding:12px 14px;margin:12px 0;cursor:pointer;font:inherit;box-shadow:5px 5px 0 var(--ink);transition:transform .1s;position:relative}
.gbtn:nth-child(3){background:#FFF1A8}.gbtn:nth-child(4){background:#D6F2FF}.gbtn:nth-child(5){background:#E6F6C8}
.gbtn:hover{transform:translate(-2px,-2px) rotate(-.6deg)}
.gbtn .em{font-size:40px;line-height:1}
.gbtn b{display:block;font-family:'Bangers',sans-serif;font-weight:400;font-size:24px;letter-spacing:1px}
.gbtn span.d{font-size:14px;font-weight:700}
.gbtn .st{margin-left:auto;font-size:20px;color:#E08A00;white-space:nowrap}
.prog{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-family:'Bangers',sans-serif;font-size:20px;letter-spacing:1px}
/* track */
.track{position:relative;height:44px;margin:0 8px 10px}
.track .line{position:absolute;left:0;right:0;top:20px;height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);opacity:.6}
.tn{position:absolute;top:10px;width:28px;height:28px;margin-left:-14px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-family:'Bangers',sans-serif;font-size:15px;display:flex;align-items:center;justify-content:center}
.tn.done{background:var(--yellow);animation:popb .5s}
.tn.cur{background:var(--blue);color:#fff}
.hero{position:absolute;top:-6px;font-size:30px;margin-left:-16px;transition:left .8s ease-in-out;z-index:2}
.flag{position:absolute;right:-10px;top:-8px;font-size:30px}
/* stage */
.stagewrap{border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);overflow:hidden;background:#fff}
.stage{position:relative;height:340px;overflow:hidden;user-select:none;-webkit-user-select:none}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(rgba(0,0,0,.2) 1px,transparent 1.3px);background-size:6px 6px;mix-blend-mode:multiply}
.stage.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.say{position:absolute;z-index:6;left:64px;right:10px;top:8px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:7px 12px;font-size:16px;line-height:1.2;box-shadow:3px 3px 0 var(--ink);animation:popb .5s both}
.say::before{content:'';position:absolute;left:-14px;top:14px;border:8px solid transparent;border-right:12px solid var(--ink)}
.say::after{content:'';position:absolute;left:-9px;top:15px;border:7px solid transparent;border-right:10px solid #fff}
.heroem{position:absolute;left:8px;top:8px;font-size:46px;line-height:1;z-index:6}
@keyframes popb{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.obj{position:absolute;line-height:1;text-align:center;transform-origin:center}
.cap{background:var(--yellow);border-top:4px solid var(--ink);padding:8px 12px;font-size:15.5px;line-height:1.35;min-height:62px}
.cap b.t{display:block;font-family:'Bangers',sans-serif;font-weight:400;font-size:19px;letter-spacing:1px;color:#B3261E}
.cap .ay{font-size:12.5px;margin-top:3px;color:#7A4A00}
.cap.good{background:#B8F08A}.cap.bad{background:#FFB3AA}
.nextrow{text-align:center;margin-top:12px;min-height:50px}
.sfx{position:absolute;z-index:9;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg);font-family:'Bangers',Impact,sans-serif;font-size:64px;letter-spacing:2px;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);pointer-events:none;animation:sfxpop 1.1s ease-out forwards;white-space:nowrap}
.sfx.small{font-size:40px;color:#fff;text-shadow:4px 4px 0 var(--red)}
@keyframes sfxpop{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(.1);opacity:0}25%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.2);opacity:1}70%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}100%{transform:translate(-50%,-90%) rotate(-5deg) scale(1);opacity:0}}

];
function startPath(){ pi = 1; pmist = 0; pdone = 0; showScreen('s-path','The Elephant Mission'); $('pend').innerHTML = ''; loadStation(); }
function loadStation(){
  clearTimers(); locked = false; $('nextrow').innerHTML = '';
  var st = $('stage'); st.className = 'stage'; st.innerHTML = ''; st.style.background = BGS[pi-1];
  $('pprog').innerHTML = 'MISSION ' + pi + ' OF ' + NN; $('pmis').innerHTML = pmist ? 'OOPS: ' + pmist : '';
  buildTrack();
  var say = ST[pi-1]();
  var h = el('heroem', '\uD83E\uDDD2'); var s = el('say', say);
  setCap('', 'MISSION ' + pi, 'Complete the mission to move ahead!');
}
function nextStep(){ if (pi === NN) { endPath(); return; } pi++; loadStation(); }
function endPath(){
  clearTimers();
  var st = pmist <= 2 ? 3 : (pmist <= 5 ? 2 : 1);
  if (st > best.p) { best.p = st; }
  pdone = NN; $('pprog').innerHTML = 'YOU MADE IT!'; $('pmis').innerHTML = ''; buildTrack();
  var stg = $('stage'); stg.innerHTML = ''; stg.style.background = '#FFE9A8';
  el('obj', '\uD83C\uDFC6', 'left:50%;top:14%;font-size:110px;margin-left:-55px;animation:bob 1.2s infinite'); el('obj', 'THE END', 'left:0;right:0;top:62%;text-align:center;font-size:52px;font-family:Bangers,sans-serif;color:#FF4B3E;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:4px 4px 0 #111');
  setCap('good', 'KAABA PROTECTED!', 'You learned that Abraha came with elephants to destroy the Kaaba, but Allah sent flocks of birds with stones of baked clay. If Allah is on your side, no army can win. Al-hamdu-lillah!');
  $('nextrow').innerHTML = '';
  $('pend').innerHTML = '<div class="end"><div class="stars">' + stars(st) + '</div><p>' + (pmist ? 'You made ' + pmist + ' oops' + (pmist > 1 ? 'es' : '') + ' on the way.' : 'No oopses! Perfect!') + '</p><button class="ibtn" style="width:auto;padding:0 24px;border-radius:999px;font-family:Bangers,sans-serif;font-size:24px;letter-spacing:1px" onclick="startPath()">\u21BB PLAY AGAIN</button></div>';
  refresh(); confetti();
}

/* ================= Game 2: Word Match ================= */
var WORDS = [["الْفِيلِ", "the elephants"], ["كَيْدَهُمْ", "their evil plan"], ["طَيْرًا", "birds"], ["أَبَابِيلَ", "flocks"], ["حِجَارَةٍ", "stones"], ["عَصْفٍ", "straw"]];
var mFirst, mLock, mMoves, mPairs;
function startMem(){
  showScreen('s-mem','Word Match');
  var cards = [];
  for (var k=0;k<WORDS.length;k++){ cards.push({id:k, t:WORDS[k][0], ar:true}); cards.push({id:k, t:WORDS[k][1], ar:false}); }
  cards = shuffle(cards);
  var h = '';
  for (var n=0;n<cards.length;n++){ h += '<button class="mc" data-id="' + cards[n].id + '" onclick="flip(this)"><span class="mi"><span class="mf">?</span><span class="mb' + (cards[n].ar ? ' ar' : '') + '">' + cards[n].t + '</span></span></button>'; }
  $('mgrid').innerHTML = h; $('mend').innerHTML = '';
  mFirst = null; mLock = false; mMoves = 0; mPairs = 0; $('mst').innerHTML = 'Moves: 0 &nbsp;&bull;&nbsp; Pairs: 0 / ' + WORDS.length;
}
function flip(el){
  if (mLock || el.className.indexOf('f') >= 0) { return; }
  el.className = 'mc f';
  if (!mFirst) { mFirst = el; return; }
  mMoves++;
  var a = mFirst, b = el; mFirst = null;
  if (a.getAttribute('data-id') === b.getAttribute('data-id')) {
    a.className = 'mc f ok'; b.className = 'mc f ok'; mPairs++;
    if (mPairs === WORDS.length) { setTimeout(endMem, 500); }
  } else {
    mLock = true;
    setTimeout(function(){ a.className = 'mc'; b.className = 'mc'; mLock = false; }, 900);
  }
  $('mst').innerHTML = 'Moves: ' + mMoves + ' &nbsp;&bull;&nbsp; Pairs: ' + mPairs + ' / ' + WORDS.length;
}
function endMem(){
  var st = mMoves <= 10 ? 3 : (mMoves <= 15 ? 2 : 1);
  if (st > best.m) { best.m = st; }
  $('mend').innerHTML = '<div class="end"><div class="bigem">\uD83C\uDF89</div><h2>You matched them all!</h2><div class="stars">' + stars(st) + '</div><p>You did it in ' + mMoves + ' moves.</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startMem()">\u21BB Play again</button></div>';
  refresh(); confetti();
}

refresh();
</script></body></html>
