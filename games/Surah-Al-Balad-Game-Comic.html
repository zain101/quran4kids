:root{--ink:#111;--yellow:#FFD93D;--red:#FF4B3E;--blue:#3AA0FF;--green:#7ED957;--paper:#FFF4D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px 10px 30px;background:var(--paper);background-image:radial-gradient(rgba(255,75,62,.18) 1.6px,transparent 1.8px);background-size:14px 14px;
 font-family:'ComicNeue','Comic Sans MS','Chalkboard SE',cursive,sans-serif;color:var(--ink);display:flex;justify-content:center;font-weight:700}
.app{width:100%;max-width:620px}
.card{background:#fff;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:10px}
header{display:flex;align-items:center;gap:10px;background:var(--red);border:4px solid var(--ink);padding:6px 10px;margin-bottom:10px}
header h1{margin:0;flex:1;font-family:'Bangers',Impact,sans-serif;font-weight:400;font-size:27px;letter-spacing:1.5px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.stars{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:'Bangers',sans-serif;font-size:19px;letter-spacing:1px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.ibtn{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);font-size:21px;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);transition:transform .08s;font-family:inherit}
.ibtn:hover{background:var(--blue);color:#fff}
.ibtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.screen{display:none}.screen.on{display:block;animation:pageIn .4s ease-out both}
@keyframes pageIn{from{opacity:0;transform:translateX(24px) rotate(.8deg)}to{opacity:1;transform:none}}
.menu h2{margin:4px 0 2px;text-align:center;font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.menu p{text-align:center;margin:6px 0 12px}
.gbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:4px solid var(--ink);background:#fff;padding:12px 14px;margin:12px 0;cursor:pointer;font:inherit;box-shadow:5px 5px 0 var(--ink);transition:transform .1s;position:relative}

 },
 function(){ /* 6 be patient (hold) */
  el('obj bob', '\uD83E\uDDE9', 'left:40%;top:30%;font-size:80px'); var face = el('obj', '\uD83E\uDD14', 'left:20%;top:34%;font-size:60px');

 },
 function(){ /* 7 kind or unkind words (drag to jars) */
  var jk = el('zone', '\uD83D\uDC9A<br>KIND', 'left:4%;top:56%;width:42%;height:38%;background:#D4F5C4;font-size:24px');

  for (var k=0;k<5;k++){ (function(w, p){ var t = el('obj', w[0], p + ';padding:8px 12px;background:#fff;border:4px solid #111;border-radius:16px;font-size:16px;box-shadow:3px 3px 0 #111;white-space:nowrap');
   makeDrag(t, [jk, ju], function(hit){ var good = (hit === jk) === !!w[1]; if (good) { t.style.display = 'none'; hit.innerHTML += '<div style="font-size:12px">' + w[0] + '</div>'; placed++; sfx('+1', true); if (placed === 5) { win('Our tongue and lips are gifts from Allah. Use them for kind words.', 'Ayah 9'); } return true; } oops('That word goes in the other jar.'); return false; }); })(words[k], ps[k]); }
  return 'Allah gave us a tongue and lips! Drag each word into the KIND or UNKIND jar.';
 },
 function(){ /* 8 find who needs help */
  var spot = Math.floor(Math.random()*6); var ps = ['left:6%;top:36%','left:36%;top:30%','left:66%;top:36%','left:12%;top:62%','left:44%;top:58%','left:70%;top:62%'];
  for (var k=0;k<6;k++){ (function(k){ var f = el('obj', k === spot ? '\uD83D\uDE22' : '\uD83D\uDE00', ps[k] + ';font-size:64px;cursor:pointer'); f.className += k === spot ? '' : ' bob';
   f.onclick = function(){ if (locked) { return; } if (k === spot) { f.innerHTML = '\uD83D\uDE0A'; win('Allah gave us eyes to see, and then to help.', 'Ayah 8'); } else { f.innerHTML = '\uD83D\uDE15'; oops('This person is fine.'); setTimeout(function(){ if (!locked) { f.innerHTML = '\uD83D\uDE00'; } }, 600); } }; })(k); }
  return 'I have two eyes! Look carefully and tap the person who needs help.';
 },
 function(){ /* 9 Allah sees */
  el('obj bob', '\uD83C\uDF6A', 'left:40%;top:48%;font-size:80px'); el('obj pulse', '\uD83D\uDC41\uFE0F', 'left:42%;top:26%;font-size:56px;z-index:2'); el('obj', 'Nobody is watching...', 'left:10%;right:10%;top:76%;text-align:center;font-size:15px;opacity:.8');
  var a = document.createElement('button'); a.className = 'chc'; a.style.cssText = 'left:4%;top:34%;width:30%;height:28%;font-size:13px'; a.innerHTML = '<span class="e" style="font-size:32px">\uD83E\uDD2B</span>Take it secretly';
  var b = document.createElement('button'); b.className = 'chc'; b.style.cssText = 'right:4%;top:34%;width:30%;height:28%;font-size:13px'; b.innerHTML = '<span class="e" style="font-size:32px">\uD83D\uDE0A</span>Remember Allah sees me';
  var cs = shuffle([[a,0],[b,1]]); $('stage').appendChild(a); $('stage').appendChild(b);
  a.onclick = function(){ if (locked) { return; } a.className = 'chc no'; oops('Allah sees everything.'); };
  b.onclick = function(){ if (locked) { return; } b.className = 'chc ok'; win('Allah sees everything we do, so we always do the right thing.', 'Ayah 7'); };
  return 'There is an extra cookie and nobody is looking. What will I do?';
 },
 function(){ /* 10 care bag */
  el('obj bob', '\uD83E\uDDD3', 'right:6%;top:28%;font-size:76px'); var bag = el('zone', '\uD83D\uDECD\uFE0F<br>Care bag', 'left:6%;top:34%;width:36%;height:30%;font-size:24px;background:#FFF1A8');
  var items = shuffle([['\uD83C\uDF5E',1],['\uD83D\uDCA7',1],['\uD83E\uDDE5',1],['\uD83D\uDDD1\uFE0F',0],['\uD83E\uDEA8',0]]); var got = 0; var ps = ['left:4%;top:68%','left:24%;top:68%','left:44%;top:68%','left:64%;top:68%','left:82%;top:46%'];
  for (var k=0;k<5;k++){ (function(it, p){ var b = document.createElement('button'); b.className = 'chc'; b.style.cssText = p + ';width:17%;height:22%'; b.innerHTML = '<span class="e">' + it[0] + '</span>'; $('stage').appendChild(b);
   b.onclick = function(){ if (locked || b.className.indexOf('ok') >= 0) { return; } if (it[1]) { b.className = 'chc ok'; got++; bag.innerHTML += '<span style="font-size:28px">' + it[0] + '</span>'; sfx('+1', true); if (got === 3) { win('Helping a poor person in need is on the challenging path.', 'Ayah 16'); } } else { b.className = 'chc no'; oops('That would not help.'); setTimeout(function(){ b.className = 'chc'; }, 500); } }; })(items[k], ps[k]); }

];
function startPath(){ pi = 1; pmist = 0; pdone = 0; showScreen('s-path','The Challenging Path'); $('pend').innerHTML = ''; loadStation(); }
function loadStation(){
  clearTimers(); locked = false; $('nextrow').innerHTML = '';
  var st = $('stage'); st.className = 'stage'; st.innerHTML = ''; st.style.background = BGS[pi-1];
  $('pprog').innerHTML = 'MISSION ' + pi + ' OF 10'; $('pmis').innerHTML = pmist ? 'OOPS: ' + pmist : '';
  buildTrack();
  var say = ST[pi-1]();
  var h = el('heroem', '\uD83E\uDDD2'); var s = el('say', say);
  setCap('', 'MISSION ' + pi, 'Complete the mission to move ahead!');
}
function nextStep(){ if (pi === 10) { endPath(); return; } pi++; loadStation(); }
function endPath(){
  clearTimers();
  var st = pmist <= 3 ? 3 : (pmist <= 8 ? 2 : 1);
  if (st > best.p) { best.p = st; }
  pdone = 10; $('pprog').innerHTML = 'YOU MADE IT!'; $('pmis').innerHTML = ''; buildTrack();
  var stg = $('stage'); stg.innerHTML = ''; stg.style.background = '#FFE9A8';
  el('obj', '\uD83C\uDFC6', 'left:50%;top:14%;font-size:110px;margin-left:-55px;animation:bob 1.2s infinite'); el('obj', 'THE END', 'left:0;right:0;top:62%;text-align:center;font-size:52px;font-family:Bangers,sans-serif;color:#FF4B3E;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:4px 4px 0 #111');
  setCap('good', 'PEOPLE OF THE RIGHT!', 'You climbed the challenging path by sharing, being kind, being patient and not wasting. Al-hamdu-lillah!');
  $('nextrow').innerHTML = '';
  $('pend').innerHTML = '<div class="end"><div class="stars">' + stars(st) + '</div><p>' + (pmist ? 'You made ' + pmist + ' oops' + (pmist > 1 ? 'es' : '') + ' on the way.' : 'No oopses! Perfect!') + '</p><button class="ibtn" style="width:auto;padding:0 24px;border-radius:999px;font-family:Bangers,sans-serif;font-size:24px;letter-spacing:1px" onclick="startPath()">\u21BB PLAY AGAIN</button></div>';
  refresh(); confetti();
}

/* ================= Game 2: Word Match ================= */
var WORDS = [
 ['\u0627\u0644\u0652\u0628\u064E\u0644\u064E\u062F\u0650','the city'],
 ['\u0639\u064E\u064A\u0652\u0646\u064E\u064A\u0652\u0646\u0650','two eyes'],
 ['\u0644\u0650\u0633\u064E\u0627\u0646\u064B\u0627','a tongue'],
 ['\u064A\u064E\u062A\u0650\u064A\u0645\u064B\u0627','an orphan'],
 ['\u0645\u0650\u0633\u0652\u0643\u0650\u064A\u0646\u064B\u0627','a poor person'],
 ['\u0628\u0650\u0627\u0644\u0635\u0651\u064E\u0628\u0652\u0631\u0650','with patience']
];
var mFirst, mLock, mMoves, mPairs;
function startMem(){
  showScreen('s-mem','Word Match');
  var cards = [];
  for (var k=0;k<WORDS.length;k++){ cards.push({id:k, t:WORDS[k][0], ar:true}); cards.push({id:k, t:WORDS[k][1], ar:false}); }
  cards = shuffle(cards);
  var h = '';
  for (var n=0;n<cards.length;n++){ h += '<button class="mc" data-id="' + cards[n].id + '" onclick="flip(this)"><span class="mi"><span class="mf">?</span><span class="mb' + (cards[n].ar ? ' ar' : '') + '">' + cards[n].t + '</span></span></button>'; }
  $('mgrid').innerHTML = h; $('mend').innerHTML = '';
  mFirst = null; mLock = false; mMoves = 0; mPairs = 0; $('mst').innerHTML = 'Moves: 0 &nbsp;&bull;&nbsp; Pairs: 0 / ' + WORDS.length;
}
function flip(el){
  if (mLock || el.className.indexOf('f') >= 0) { return; }
  el.className = 'mc f';
  if (!mFirst) { mFirst = el; return; }
  mMoves++;
  var a = mFirst, b = el; mFirst = null;
  if (a.getAttribute('data-id') === b.getAttribute('data-id')) {
    a.className = 'mc f ok'; b.className = 'mc f ok'; mPairs++;
    if (mPairs === WORDS.length) { setTimeout(endMem, 500); }
  } else {
    mLock = true;
    setTimeout(function(){ a.className = 'mc'; b.className = 'mc'; mLock = false; }, 900);
  }
  $('mst').innerHTML = 'Moves: ' + mMoves + ' &nbsp;&bull;&nbsp; Pairs: ' + mPairs + ' / ' + WORDS.length;
}
function endMem(){
  var st = mMoves <= 10 ? 3 : (mMoves <= 15 ? 2 : 1);
  if (st > best.m) { best.m = st; }
  $('mend').innerHTML = '<div class="end"><div class="bigem">\uD83C\uDF89</div><h2>You matched them all!</h2><div class="stars">' + stars(st) + '</div><p>You did it in ' + mMoves + ' moves.</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startMem()">\u21BB Play again</button></div>';
  refresh(); confetti();
}

/* ================= Game 3: Omar's Food Journey ================= */
var FOODS = [['\uD83C\uDF5A','Rice','Indonesia'],['\uD83C\uDF36\uFE0F','Green peppers','Mexico'],['\uD83E\uDED2','Olive oil','Palestine'],['\uD83D\uDC1F','Salmon','Australia'],['\uD83E\uDD55','Carrots','United States'],['\uD83C\uDF44','Mushrooms','Canada']];
var fSel, fMist, fDone;
function startFood(){
  showScreen('s-food',"Omar's Food Journey");
  fSel = null; fMist = 0; fDone = 0; $('fend').innerHTML = '';
  var left = '', right = '', order = shuffle([0,1,2,3,4,5]);
  var L = [], R = [];
  for (var k=0;k<6;k++){ L.push('<button class="fi" data-id="' + k + '" data-side="l" onclick="fpick(this)"><span class="e">' + FOODS[k][0] + '</span>' + FOODS[k][1] + '</button>'); }
  for (var n=0;n<6;n++){ var id = order[n]; R.push('<button class="fi r" data-id="' + id + '" data-side="r" onclick="fpick(this)">' + FOODS[id][2] + '</button>'); }
  var h = '';
  for (var m=0;m<6;m++){ h += L[m] + R[m]; }
  $('fm').innerHTML = h;
}
function fpick(el){
  if (el.className.indexOf('ok') >= 0) { return; }
  var side = el.getAttribute('data-side');
  if (!fSel || fSel.getAttribute('data-side') === side) {
    if (fSel) { fSel.className = fSel.className.replace(' sel',''); }
    fSel = el; el.className += ' sel'; return;
  }
  var a = fSel; fSel = null; a.className = a.className.replace(' sel','');
  if (a.getAttribute('data-id') === el.getAttribute('data-id')) {
    a.className += ' ok'; el.className += ' ok'; fDone++;
    if (fDone === 6) { setTimeout(endFood, 500); }
  } else {
    fMist++;
    a.className += ' bad'; el.className += ' bad';
    setTimeout(function(){ a.className = a.className.replace(' bad',''); el.className = el.className.replace(' bad',''); }, 500);
  }
}
function endFood(){
  var st = fMist <= 1 ? 3 : (fMist <= 4 ? 2 : 1);
  if (st > best.f) { best.f = st; }
  $('fend').innerHTML = '<div class="end"><div class="bigem">\uD83C\uDF0D</div><h2>Great job!</h2><div class="stars">' + stars(st) + '</div><p>Each food travelled thousands of miles, and many people helped bring it to the table. Let us finish our food or share it. Al-hamdu-lillah!</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startFood()">\u21BB Play again</button></div>';
  refresh(); confetti();
}

refresh();
