*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#FDF8EF;color:#33271C;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:600px}
.card{background:#fff;border:3px solid #E0A33C;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(51,39,28,.13)}
header{background:#0E6B70;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:20px;flex:1}
header .stars{background:#F6DFAE;color:#08484C;font-weight:700;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:50%;border:2px solid #0E6B70;background:#fff;color:#0E6B70;font-size:20px;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:#0E6B70;color:#fff}
header .ibtn{border-color:#F6DFAE;background:transparent;color:#fff}
header .ibtn:hover{background:#F6DFAE;color:#08484C}
.screen{display:none;padding:16px}
.screen.on{display:block}
.menu h2{margin:4px 0 4px;text-align:center;color:#B4573F}
.menu p{text-align:center;margin:0 0 14px;color:#6B5A46}
.gbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:3px solid #0E6B70;background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer;font:inherit}
.gbtn:hover{background:#EAF4F1}
.gbtn .em{font-size:40px;line-height:1}
.gbtn b{display:block;font-size:18px;color:#0E6B70}
.gbtn span.d{font-size:13.5px;color:#6B5A46}
.gbtn .st{margin-left:auto;font-size:18px;color:#E0A33C;white-space:nowrap}
/* path game */
.board{background:linear-gradient(#CFEAF7,#EAF4F1 55%);border:3px solid #F6DFAE;border-radius:16px;overflow:hidden;line-height:0}
.board svg{width:100%;height:auto}
.avatar{transition:transform .9s ease-in-out}
.scn{margin-top:12px;background:#F5EAD6;border-radius:16px;padding:12px 14px}
.scn .big{font-size:46px;text-align:center;line-height:1.1}
.scn .q{font-size:18px;font-weight:700;text-align:center;margin:4px 0 8px;color:#08484C}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid #0E6B70;background:#fff;color:#08484C;border-radius:16px;padding:10px 14px;margin:8px 0;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer}
.ch .e{font-size:30px}
.ch:hover{background:#FFF6DE}
.ch.good{background:#DDF2E0;border-color:#3E9B55;color:#1F5E31}
.ch.bad{background:#FBE0DA;border-color:#B4573F;color:#8C2F1E;animation:shake .4s}
.ch.lock{opacity:.5;cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:8px;padding:10px 14px;border-radius:14px;background:#fff;border:3px solid #E0A33C;font-size:15px;line-height:1.45;display:none}
.fb.show{display:block}
.fb .ay{font-size:12.5px;color:#9A6C1E;font-weight:700;margin-top:4px}
.next{display:none;margin:10px auto 0;padding:0 26px;width:auto;border-radius:999px;height:48px;font-size:18px;font-weight:700}
.next.show{display:block}
.prog{text-align:center;font-weight:700;color:#9A6C1E;font-size:14px;margin:0 0 8px}
/* end */
.end{text-align:center;padding:10px 0}
.end .big{font-size:60px}
.end h2{margin:6px 0;color:#0E6B70}
.end .stars{font-size:44px;color:#E0A33C;letter-spacing:6px}
.end p{color:#4A3E31;margin:8px 0 14px;font-size:16px}
.confetti{position:fixed;left:0;top:-30px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{perspective:600px;height:96px;cursor:pointer;border:0;background:none;padding:0}
.mi{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .mi{transform:rotateY(180deg)}
.mf,.mb{position:absolute;inset:0;border-radius:14px;border:3px solid #0E6B70;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;padding:4px}
.mf{background:repeating-linear-gradient(45deg,#0E6B70,#0E6B70 8px,#127A80 8px,#127A80 16px);color:#F6DFAE;font-size:34px;font-weight:700}
.mb{background:#fff;transform:rotateY(180deg);font-size:17px;font-weight:700;color:#08484C}
.mb.ar{font-family:'AmiriSub',serif;font-size:32px;direction:rtl;line-height:1.5}
.mc.ok .mb{background:#DDF2E0;border-color:#3E9B55}
.mst{text-align:center;font-weight:700;color:#9A6C1E;margin:0 0 10px}
/* food match */
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fi{display:flex;align-items:center;gap:8px;border:3px solid #E0A33C;background:#fff;border-radius:14px;padding:10px;font:inherit;font-size:16px;font-weight:700;color:#33271C;cursor:pointer;min-height:56px;text-align:left}
.fi .e{font-size:28px}
.fi.r{border-color:#0E6B70;background:#EAF4F1;justify-content:center;text-align:center}
.fi.sel{outline:4px solid #E0A33C;background:#FFF6DE}
.fi.ok{background:#DDF2E0;border-color:#3E9B55;color:#1F5E31;cursor:default}
.fi.bad{background:#FBE0DA;border-color:#B4573F;animation:shake .4s}
.hint{margin:0 0 10px;text-align:center;color:#6B5A46;font-size:14.5px}
</style></head><body>

<div class="screen menu on" id="s-menu">

<script>
var $ = function(id){ return document.getElementById(id); };
var best = {p:0, m:0, f:0};
function stars(n){ var s=''; for (var k=0;k<3;k++){ s += k<n ? '\u2605' : '\u2606'; } return s; }
function refresh(){
  var t = best.p + best.m + best.f;
  $('tot').innerHTML = '\u2B50 ' + t;
  $('st1').innerHTML = best.p ? stars(best.p) : '';
  $('st2').innerHTML = best.m ? stars(best.m) : '';
  $('st3').innerHTML = best.f ? stars(best.f) : '';
}
function showScreen(id, title){
  var ss = document.getElementsByClassName('screen');
  for (var k=0;k<ss.length;k++){ ss[k].className = 'screen' + (ss[k].id === id ? ' on' : ''); }
  $('home').style.display = id === 's-menu' ? 'none' : '';
  $('ttl').innerHTML = title;
  window.scrollTo(0,0);
}
$('home').onclick = function(){ showScreen('s-menu','Al-Balad Adventure'); refresh(); };
function shuffle(a){ a = a.slice(); for (var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; } return a; }
function confetti(){
  var em = ['\u2B50','\uD83C\uDF89','\uD83C\uDF1F','\u2728'];
  for (var k=0;k<28;k++){
    var s = document.createElement('span'); s.className='confetti'; s.innerHTML = em[k%em.length];
    s.style.left = Math.random()*100 + 'vw'; s.style.animationDuration = (2 + Math.random()*2.5) + 's'; s.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(s); (function(s){ setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 5200); })(s);
  }
}

 {e:'\uD83E\uDDD2', q:'A new classmate has nobody to play with.', r:['\uD83D\uDE0A','Invite them to play'], w:['\uD83D\uDE44','Ignore them'], why:'Believers encourage each other to be kind.', ay:'Ayah 17'},
 {e:'\uD83C\uDFC6', q:'You win a prize and feel proud. What do you say?', r:['\uD83E\uDD32','Alhamdulillah, thank You Allah'], w:['\uD83D\uDE0E','I am the best, look at me!'], why:'Allah does not like boasting. Be thankful and humble.', ay:'Ayah 6'},
 {e:'\uD83D\uDC76', q:'A child with no parents looks sad and alone.', r:['\u2764\uFE0F','Be kind and help them'], w:['\uD83D\uDEB6','Walk away'], why:'Caring for an orphan is a good deed.', ay:'Ayah 15'},
 {e:'\uD83D\uDEB0', q:'The tap is running while you brush your teeth.', r:['\uD83D\uDC4D','Turn it off to save water'], w:['\uD83D\uDCA7','Leave it running'], why:'A Muslim should not waste, even water.', ay:'Words of Wisdom'},
 {e:'\uD83E\uDDE9', q:'Your friend is stuck on a hard puzzle.', r:['\uD83D\uDCAA','Be patient and encourage them'], w:['\uD83D\uDE20','Get cross and tell them to hurry'], why:'Believers encourage each other to be patient.', ay:'Ayah 17'},
 {e:'\uD83D\uDC44', q:'Allah gave you a tongue and lips. How will you use them?', r:['\uD83D\uDDE3\uFE0F','Say kind words'], w:['\uD83E\uDD2C','Say mean words'], why:'Our tongue and lips are gifts from Allah.', ay:'Ayah 9'},
 {e:'\uD83D\uDC40', q:'Allah gave you two eyes. What will you look for?', r:['\uD83D\uDD0D','Someone who needs help'], w:['\uD83D\uDE48','Look away from people in need'], why:'Allah gave us eyes to see and then to do good.', ay:'Ayah 8'},
 {e:'\uD83C\uDF6A', q:'Nobody is watching. You could take an extra cookie.', r:['\uD83E\uDD14','Remember Allah sees me. Do not take it.'], w:['\uD83E\uDD2B','Take it secretly'], why:'Allah sees everything we do.', ay:'Ayah 7'},
 {e:'\uD83E\uDDD3', q:'A poor person asks you for help.', r:['\uD83C\uDF81','Give what I can'], w:['\uD83D\uDE45','Say go away'], why:'Helping a poor person in need is on the challenging path.', ay:'Ayah 16'}
];
var pi, pmist, pdone;
function drawBoard(){
  var s = '<defs><linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DBB6A"/><stop offset="1" stop-color="#5E9E5A"/></linearGradient></defs>';
  s += '<circle cx="355" cy="38" r="20" fill="#F2C94C" stroke="#E0A33C" stroke-width="3"/>';
  s += '<g fill="#fff" opacity=".9"><circle cx="60" cy="40" r="14"/><circle cx="82" cy="34" r="18"/><circle cx="104" cy="42" r="13"/></g>';
  s += '<path d="M 0 270 V 90 Q 120 20 260 70 T 400 110 V 270 Z" fill="url(#hill)"/>';
  var d = 'M ' + NODES[0][0] + ' ' + NODES[0][1];
  for (var k=1;k<NODES.length;k++){ d += ' L ' + NODES[k][0] + ' ' + NODES[k][1]; }
  s += '<path d="' + d + '" stroke="#8A6A44" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  s += '<path d="' + d + '" stroke="#F6DFAE" stroke-width="3" fill="none" stroke-dasharray="6 8" stroke-linecap="round" stroke-linejoin="round"/>';
  for (var n=1;n<=10;n++){
    var done = n <= pdone;
    s += '<g><circle cx="' + NODES[n][0] + '" cy="' + NODES[n][1] + '" r="13" fill="' + (done ? '#F2C94C' : '#fff') + '" stroke="' + (done ? '#9A6C1E' : '#0E6B70') + '" stroke-width="3"/>';
    s += '<text x="' + NODES[n][0] + '" y="' + (NODES[n][1]+5) + '" font-size="14" font-weight="bold" text-anchor="middle" fill="' + (done ? '#9A6C1E' : '#0E6B70') + '">' + (done ? '\u2605' : n) + '</text></g>';
  }
  var f = NODES[11];
  s += '<path d="M ' + f[0] + ' ' + f[1] + ' V ' + (f[1]-34) + '" stroke="#6F5436" stroke-width="4"/><path d="M ' + f[0] + ' ' + (f[1]-34) + ' h 34 l -9 9 l 9 9 h -34 Z" fill="#B4573F"/>';
  s += '<text x="' + (f[0]+44) + '" y="' + (f[1]-6) + '" font-size="11" font-weight="bold" fill="#08484C">People of the right</text>';
  var a = NODES[pdone === 10 && pi > 10 ? 11 : Math.min(pi-1, 10)];
  s += '<g class="avatar" id="av" style="transform:translate(' + a[0] + 'px,' + a[1] + 'px)"><circle cx="0" cy="-26" r="8" fill="#0E6B70"/><path d="M -9 -4 Q -9 -17 0 -17 Q 9 -17 9 -4 L 9 8 Q 0 12 -9 8 Z" fill="#0E6B70"/><circle cx="-3" cy="-27" r="1.4" fill="#fff"/><circle cx="3" cy="-27" r="1.4" fill="#fff"/></g>';
  $('bsvg').innerHTML = s;
}
function startPath(){ pi = 1; pmist = 0; pdone = 0; showScreen('s-path','The Challenging Path'); drawBoard(); showScn(); }
function showScn(){
  var c = SC[pi-1];
  $('pprog').innerHTML = 'Step ' + pi + ' of 10';
  var opts = shuffle([{o:c.r, g:true},{o:c.w, g:false}]);
  var h = '<div class="scn"><div class="big">' + c.e + '</div><div class="q">' + c.q + '</div>';
  for (var k=0;k<2;k++){ h += '<button class="ch" data-good="' + (opts[k].g ? 1 : 0) + '" onclick="pick(this)"><span class="e">' + opts[k].o[0] + '</span><span>' + opts[k].o[1] + '</span></button>'; }
  h += '<div class="fb" id="fb"></div><button class="ibtn next" id="nx" onclick="nextStep()" aria-label="Next">Next \u2192</button></div>';
  $('pbody').innerHTML = h;
}
function pick(btn){
  if (btn.className.indexOf('lock') >= 0) { return; }
  var good = btn.getAttribute('data-good') === '1', c = SC[pi-1], fb = $('fb');
  if (!good) {
    pmist++;
    btn.className = 'ch bad lock';
    fb.innerHTML = '\u274C Oops! That is not the best choice. Try the other one!';
    fb.className = 'fb show';
    return;
  }
  var bs = document.getElementsByClassName('ch');
  for (var k=0;k<bs.length;k++){ bs[k].className = bs[k].className.indexOf('bad') >= 0 ? bs[k].className : (bs[k] === btn ? 'ch good lock' : 'ch lock'); }
  fb.innerHTML = '\u2705 <b>Great choice!</b> ' + c.why + '<div class="ay">' + c.ay + '</div>';
  fb.className = 'fb show';
  pdone = pi;
  var nxt = NODES[pi];
  drawBoard();
  var av = $('av'); av.style.transform = 'translate(' + NODES[pi-1][0] + 'px,' + NODES[pi-1][1] + 'px)';
  setTimeout(function(){ av.style.transform = 'translate(' + nxt[0] + 'px,' + nxt[1] + 'px)'; }, 30);
  $('nx').className = 'ibtn next show';
  $('nx').innerHTML = pi === 10 ? 'Finish \uD83C\uDFC1' : 'Next \u2192';
}
function nextStep(){
  if (pi === 10) { endPath(); return; }
  pi++; showScn();
}
function endPath(){
  var st = pmist <= 1 ? 3 : (pmist <= 4 ? 2 : 1);
  if (st > best.p) { best.p = st; }
  pi = 11; drawBoard(); $('pprog').innerHTML = 'You made it!';
  $('pbody').innerHTML = '<div class="end"><div class="big">\uD83C\uDFC1</div><h2>You are one of the people of the right!</h2><div class="stars">' + stars(st) + '</div><p>You climbed the challenging path by sharing, being kind and not wasting. Al-hamdu-lillah!</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startPath()">\u21BB Play again</button></div>';
  refresh(); confetti();
}

/* ================= Game 2: Word Match ================= */
var WORDS = [
 ['\u0627\u0644\u0652\u0628\u064E\u0644\u064E\u062F\u0650','the city'],
 ['\u0639\u064E\u064A\u0652\u0646\u064E\u064A\u0652\u0646\u0650','two eyes'],
 ['\u0644\u0650\u0633\u064E\u0627\u0646\u064B\u0627','a tongue'],
 ['\u064A\u064E\u062A\u0650\u064A\u0645\u064B\u0627','an orphan'],
 ['\u0645\u0650\u0633\u0652\u0643\u0650\u064A\u0646\u064B\u0627','a poor person'],
 ['\u0628\u0650\u0627\u0644\u0635\u0651\u064E\u0628\u0652\u0631\u0650','with patience']
];
var mFirst, mLock, mMoves, mPairs;
function startMem(){
  showScreen('s-mem','Word Match');
  var cards = [];
  for (var k=0;k<WORDS.length;k++){ cards.push({id:k, t:WORDS[k][0], ar:true}); cards.push({id:k, t:WORDS[k][1], ar:false}); }
  cards = shuffle(cards);
  var h = '';
  for (var n=0;n<cards.length;n++){ h += '<button class="mc" data-id="' + cards[n].id + '" onclick="flip(this)"><span class="mi"><span class="mf">?</span><span class="mb' + (cards[n].ar ? ' ar' : '') + '">' + cards[n].t + '</span></span></button>'; }
  $('mgrid').innerHTML = h; $('mend').innerHTML = '';
  mFirst = null; mLock = false; mMoves = 0; mPairs = 0; $('mst').innerHTML = 'Moves: 0 &nbsp;&bull;&nbsp; Pairs: 0 / ' + WORDS.length;
}
function flip(el){
  if (mLock || el.className.indexOf('f') >= 0) { return; }
  el.className = 'mc f';
  if (!mFirst) { mFirst = el; return; }
  mMoves++;
  var a = mFirst, b = el; mFirst = null;
  if (a.getAttribute('data-id') === b.getAttribute('data-id')) {
    a.className = 'mc f ok'; b.className = 'mc f ok'; mPairs++;
    if (mPairs === WORDS.length) { setTimeout(endMem, 500); }
  } else {
    mLock = true;
    setTimeout(function(){ a.className = 'mc'; b.className = 'mc'; mLock = false; }, 900);
  }
  $('mst').innerHTML = 'Moves: ' + mMoves + ' &nbsp;&bull;&nbsp; Pairs: ' + mPairs + ' / ' + WORDS.length;
}
function endMem(){
  var st = mMoves <= 10 ? 3 : (mMoves <= 15 ? 2 : 1);
  if (st > best.m) { best.m = st; }
  $('mend').innerHTML = '<div class="end"><div class="big">\uD83C\uDF89</div><h2>You matched them all!</h2><div class="stars">' + stars(st) + '</div><p>You did it in ' + mMoves + ' moves.</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startMem()">\u21BB Play again</button></div>';
  refresh(); confetti();
}

/* ================= Game 3: Omar's Food Journey ================= */
var FOODS = [['\uD83C\uDF5A','Rice','Indonesia'],['\uD83C\uDF36\uFE0F','Green peppers','Mexico'],['\uD83E\uDED2','Olive oil','Palestine'],['\uD83D\uDC1F','Salmon','Australia'],['\uD83E\uDD55','Carrots','United States'],['\uD83C\uDF44','Mushrooms','Canada']];
var fSel, fMist, fDone;
function startFood(){
  showScreen('s-food',"Omar's Food Journey");
  fSel = null; fMist = 0; fDone = 0; $('fend').innerHTML = '';
  var left = '', right = '', order = shuffle([0,1,2,3,4,5]);
  var L = [], R = [];
  for (var k=0;k<6;k++){ L.push('<button class="fi" data-id="' + k + '" data-side="l" onclick="fpick(this)"><span class="e">' + FOODS[k][0] + '</span>' + FOODS[k][1] + '</button>'); }
  for (var n=0;n<6;n++){ var id = order[n]; R.push('<button class="fi r" data-id="' + id + '" data-side="r" onclick="fpick(this)">' + FOODS[id][2] + '</button>'); }
  var h = '';
  for (var m=0;m<6;m++){ h += L[m] + R[m]; }
  $('fm').innerHTML = h;
}
function fpick(el){
  if (el.className.indexOf('ok') >= 0) { return; }
  var side = el.getAttribute('data-side');
  if (!fSel || fSel.getAttribute('data-side') === side) {
    if (fSel) { fSel.className = fSel.className.replace(' sel',''); }
    fSel = el; el.className += ' sel'; return;
  }
  var a = fSel; fSel = null; a.className = a.className.replace(' sel','');
  if (a.getAttribute('data-id') === el.getAttribute('data-id')) {
    a.className += ' ok'; el.className += ' ok'; fDone++;
    if (fDone === 6) { setTimeout(endFood, 500); }
  } else {
    fMist++;
    a.className += ' bad'; el.className += ' bad';
    setTimeout(function(){ a.className = a.className.replace(' bad',''); el.className = el.className.replace(' bad',''); }, 500);
  }
}
function endFood(){
  var st = fMist <= 1 ? 3 : (fMist <= 4 ? 2 : 1);
  if (st > best.f) { best.f = st; }
  $('fend').innerHTML = '<div class="end"><div class="big">\uD83C\uDF0D</div><h2>Great job!</h2><div class="stars">' + stars(st) + '</div><p>Each food travelled thousands of miles, and many people helped bring it to the table. Let us finish our food or share it. Al-hamdu-lillah!</p><button class="ibtn" style="width:auto;padding:0 22px;border-radius:999px" onclick="startFood()">\u21BB Play again</button></div>';
  refresh(); confetti();
}
refresh();
</script></body></html>
